<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>Koreyscha so'z farqlari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: one presentation stage per screen; header picks the word pair, footer steps through reveals. */
:root {
  --bg: #FFFFFF;
  --surface: #F4F6FA;
  --line: #E3E8F0;
  --fg: #1F2A44;
  --muted: #5A6478;
  --blue: #2F7FD8;
  --blue-tint: #EAF4FE;
  --on-blue: #FFFFFF;
  --red: #E8203E;
  --red-tint: #FDECEE;
  --on-red: #FFFFFF;
  --font: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --radius: 22px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1524; --surface: #182036; --line: #26304A; --fg: #E9EEF7; --muted: #A3AEC4;
    --blue: #6CB0FA; --blue-tint: #15253D; --on-blue: #0F1524;
    --red: #FF5570; --red-tint: #2C1822; --on-red: #0F1524;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1524; --surface: #182036; --line: #26304A; --fg: #E9EEF7; --muted: #A3AEC4;
  --blue: #6CB0FA; --blue-tint: #15253D; --on-blue: #0F1524;
  --red: #FF5570; --red-tint: #2C1822; --on-red: #0F1524;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font);
  font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 18px 28px; display: flex; flex-direction: column; gap: 16px; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 20px; }
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; min-width: 0; }
.brand img { width: 42px; height: auto; display: block; }
.brand h1 { margin: 0; font-size: 1.15rem; font-weight: 700; letter-spacing: -0.01em; }
.tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; max-width: 100%; }
.tab {
  font: inherit; font-size: .92rem; font-weight: 500; white-space: nowrap; cursor: pointer;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  padding: 7px 14px; border-radius: 999px; display: inline-flex; gap: 8px; align-items: center;
}
.tab b { font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.tab[aria-current="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.tab[aria-current="true"] b { color: var(--bg); opacity: .7; }
.tab:focus-visible, .btn:focus-visible, .stage:focus-visible, .ig:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

/* stage */
.stage {
  position: relative; border-radius: var(--radius); background: var(--bg);
  border: 1px solid var(--line); overflow: hidden; cursor: pointer; user-select: none;
  min-height: 520px; display: flex;
}
@media (min-width: 900px) { .stage { aspect-ratio: 16 / 9; min-height: 0; } }
.scene { flex: 1; min-width: 0; padding: clamp(22px, 4vw, 52px); display: flex; flex-direction: column; gap: clamp(14px, 2.2vw, 26px); animation: sceneIn .45s ease both; }
@keyframes sceneIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.scene h2 { margin: 0; font-size: clamp(1.6rem, 3.2vw, 2.5rem); font-weight: 900; letter-spacing: -0.02em; text-wrap: balance; }

.reveal { opacity: 0; transform: translateY(14px); transition: opacity .45s ease, transform .45s ease; }
.reveal.on { opacity: 1; transform: none; }

/* cover */
.cover { align-items: center; justify-content: center; text-align: center; }
.cover .q { margin: 0; font-size: clamp(1.1rem, 2.2vw, 1.6rem); font-weight: 500; color: var(--muted); }
.versus { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: clamp(14px, 3vw, 40px); }
.versus .w { font-size: clamp(2.8rem, 8vw, 6rem); font-weight: 900; letter-spacing: -0.02em; line-height: 1.1; }
.w1 { color: var(--blue); } .w2 { color: var(--red); }
.vs { width: clamp(58px, 7vw, 88px); aspect-ratio: 1; border-radius: 50%; background: var(--red); color: var(--on-red); display: grid; place-items: center; font-weight: 700; font-size: clamp(1.1rem, 2.2vw, 1.6rem); }
.pop { animation: pop .55s cubic-bezier(.2,.8,.2,1) both; }
.pop.d2 { animation-delay: .25s; } .pop.d3 { animation-delay: .45s; }
@keyframes pop { from { opacity: 0; transform: translateY(16px) scale(.96); } to { opacity: 1; transform: none; } }

/* difference */
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(14px, 2vw, 24px); flex: 1; }
.card { border-radius: 18px; padding: clamp(18px, 2.6vw, 30px); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.b { background: var(--blue-tint); } .card.r { background: var(--red-tint); }
.card .w { font-size: clamp(2rem, 4.2vw, 3.2rem); font-weight: 900; line-height: 1.1; }
.card.b .w { color: var(--blue); } .card.r .w { color: var(--red); }
.card .uz { margin: 0; font-size: clamp(1.05rem, 1.8vw, 1.35rem); font-weight: 700; }
.pill { align-self: flex-start; font-size: .88rem; font-weight: 700; padding: 5px 14px; border-radius: 999px; }
.card.b .pill { background: var(--blue); color: var(--on-blue); } .card.r .pill { background: var(--red); color: var(--on-red); }
.points { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.points li { display: grid; grid-template-columns: 14px 1fr; gap: 12px; align-items: start; font-size: clamp(.98rem, 1.5vw, 1.12rem); }
.points li::before { content: ""; width: 12px; height: 12px; border-radius: 50%; margin-top: .45em; }
.card.b .points li::before { background: var(--blue); } .card.r .points li::before { background: var(--red); }

/* examples */
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(16px, 3vw, 40px); }
.col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.chip { align-self: flex-start; padding: 6px 20px; border-radius: 999px; font-weight: 700; font-size: 1.1rem; }
.col.b .chip { background: var(--blue); color: var(--on-blue); } .col.r .chip { background: var(--red); color: var(--on-red); }
.ex { display: grid; grid-template-columns: 38px 1fr; gap: 14px; align-items: start; }
.num { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.col.b .num { background: var(--blue); color: var(--on-blue); } .col.r .num { background: var(--red); color: var(--on-red); }
.kr { margin: 0; font-size: clamp(1.1rem, 2vw, 1.45rem); line-height: 1.45; }
.kr mark { background: none; font-weight: 700; }
.col.b mark { color: var(--blue); } .col.r mark { color: var(--red); }
.tr { margin: 4px 0 0; color: var(--muted); font-size: clamp(.92rem, 1.4vw, 1.02rem); }

/* summary */
.rows { display: flex; flex-direction: column; justify-content: center; gap: 20px; flex: 1; }
.row { border-radius: 20px; padding: clamp(18px, 3vw, 34px) clamp(20px, 3vw, 36px); display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.row .dot { width: 16px; height: 16px; border-radius: 50%; flex: none; }
.row .cond { flex: 1 1 260px; min-width: 0; font-size: clamp(1.1rem, 2.3vw, 1.7rem); }
.row .ans { font-size: clamp(1.7rem, 3.8vw, 2.8rem); font-weight: 900; }
.row.b { background: var(--blue-tint); } .row.b .dot { background: var(--blue); } .row.b .ans { color: var(--blue); }
.row.r { background: var(--red-tint); } .row.r .dot { background: var(--red); } .row.r .ans { color: var(--red); }

/* outro */
.outro { align-items: center; justify-content: center; text-align: center; }
.outro .mark { width: clamp(72px, 9vw, 110px); height: auto; }
.outro h2 { max-width: 22ch; }
.ig { display: inline-flex; align-items: center; gap: 16px; padding: 12px 28px 12px 14px; border-radius: 999px; background: var(--surface); color: var(--fg); text-decoration: none; font-weight: 700; font-size: clamp(1.3rem, 2.8vw, 2rem); }
.ig img { width: clamp(44px, 5vw, 60px); height: auto; display: block; }
.next-pair { font: inherit; cursor: pointer; border: 0; background: none; color: var(--blue); font-weight: 700; font-size: 1.02rem; padding: 6px 10px; border-radius: 10px; }

/* footer controls */
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
.btn { font: inherit; font-weight: 700; cursor: pointer; border-radius: 999px; padding: 10px 22px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: var(--on-blue); }
.btn:disabled { opacity: .4; cursor: default; }
.progress { flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.btn[aria-label] { min-width: 64px; font-size: 1.2rem; padding: 8px 20px; }
.progress .bars { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.progress .bars span { height: 6px; border-radius: 3px; background: var(--line); }
.progress .bars span.done { background: var(--blue); }
.progress .bars span.now { background: var(--red); }

@media (max-width: 760px) {
  .cards, .cols { grid-template-columns: 1fr; }
  .row { padding: 14px 18px; }
}
@media (prefers-reduced-motion: reduce) {
  .scene, .pop { animation: none; }
  .reveal { transition: none; transform: none; }
}
</style>

      points: ["Do'kon yoki tashkilotdan muddatga olish", "Odatda pullik; e'lon va yozuvlarda ko'p uchraydi"],
      examples: [["한강 공원에서 자전거를 ", "대여했어요", ".", "Xan daryosi bog'ida velosiped ijaraga oldim."],
                 ["이 가게는 한복을 하루 2만 원에 ", "대여해", " 줘요.", "Bu do'kon hanbokni kuniga 20 ming vonga ijaraga beradi."]] },
    summary: [["Tanishdan, odatda tekin", "빌리다"], ["Do'kon yoki xizmatdan, haq evaziga", "대여하다"]],  },
  {
    w1: { kr: "알다", uz: "bilmoq", tag: "Ma'lumot · fakt",
      points: ["Ism, raqam, manzil kabi faktni bilish", "Odamni tanish ham — 알다"],
      examples: [["저는 그 사람 전화번호를 ", "알아요", ".", "Men o'sha odamning telefon raqamini bilaman."],
                 ["그 식당이 어디에 있는지 ", "알아요", "?", "O'sha restoran qayerdaligini bilasizmi?"]] },
    w2: { kr: "이해하다", uz: "tushunmoq", tag: "Ma'no · sabab",
      points: ["Nega va qanday ekanini anglash", "Birovning holatini tushunish ham — 이해하다"],
      examples: [["선생님 설명을 듣고 문법을 ", "이해했어요", ".", "O'qituvchining tushuntirishini eshitib, grammatikani tushundim."],
                 ["그 마음 충분히 ", "이해해요", ".", "Ko'nglingizni to'liq tushunaman."]] },
    summary: [["Faktni, ma'lumotni bilasiz", "알다"], ["Sabab va ma'noni anglaysiz", "이해하다"]],  },
  {
    w1: { kr: "바뀌다", uz: "almashmoq, o'zgarmoq", tag: "Boshqasiga almashadi",
      points: ["Bir narsa boshqasi bilan almashadi (A → B)", "Grammatika: N이/가 N(으)로 바뀌다"],
      examples: [["전화번호가 ", "바뀌었어요", ".", "Telefon raqamim o'zgardi (yangisiga almashdi)."],
                 ["신호등이 빨간색으로 ", "바뀌었어요", ".", "Svetofor qizil rangga o'tdi."]] },
    w2: { kr: "변하다", uz: "o'zgarmoq", tag: "Asta-sekin, ichidan",
      points: ["Narsaning o'zi (xususiyati, holati) asta o'zgaradi", "Masalan: fe'l-atvor, ta'm yoki shahar qiyofasi o'zgarganda"],
      examples: [["10년 동안 고향이 많이 ", "변했어요", ".", "10 yil ichida ona shahrim ancha o'zgardi."],
                 ["그 친구는 성격이 많이 ", "변했어요", ".", "O'sha do'stimning fe'l-atvori ancha o'zgarib ketdi."]] },
    summary: [["Biri boshqasiga almashsa (A → B)", "바뀌다"], ["Narsaning o'zi asta o'zgarsa", "변하다"]],  },
  {
    w1: { kr: "고치다", uz: "tuzatmoq", tag: "Keng ma'noli",
      points: ["Buyum, xato, odat — hammasini tuzatish", "Kundalik nutqda juda ko'p ishlatiladi"],
      examples: [["고장 난 의자를 제가 직접 ", "고쳤어요", ".", "Buzilgan stulni o'zim tuzatdim."],
                 ["나쁜 습관을 ", "고치고", " 싶어요.", "Yomon odatimni tuzatmoqchiman."]] },
    w2: { kr: "수리하다", uz: "ta'mirlamoq", tag: "Texnika · usta ishi",
      points: ["Mashina, texnika, bino uchun ishlatiladi", "Ko'pincha usta yoki servis bajaradi"],
      examples: [["노트북을 서비스 센터에서 ", "수리했어요", ".", "Noutbukni servis markazida ta'mirlatdim."],
                 ["엘리베이터를 ", "수리하는", " 중입니다.", "Lift ta'mirlanmoqda."]] },
    summary: [["Buyum, xato, odat", "고치다"], ["Texnika, bino, usta ishi", "수리하다"]],  }
];

const SCENES = [
  { id: "cover", steps: 0 },
  { id: "diff", steps: 2 },
  { id: "examples", steps: 4 },
  { id: "summary", steps: 2 },
  { id: "outro", steps: 0 }
];

const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const state = { p: 0, s: 0, k: 0 };
let built = "";

const stage = document.getElementById("stage");
const tabs = document.getElementById("tabs");

function sceneHTML(p, s) {
  const d = PAIRS[p];
  const id = SCENES[s].id;
  if (id === "cover") return `
    <section class="scene cover">
      <p class="q pop">Farqni bilasizmi?</p>
      <div class="versus">
        <span class="w w1 pop d2">${d.w1.kr}</span>
        <span class="vs pop d3">vs</span>
        <span class="w w2 pop d3">${d.w2.kr}</span>
      </div>
    </section>`;
  if (id === "diff") {
    const card = (w, cls, step) => `
      <article class="card ${cls} reveal" data-step="${step}">
        <div class="w">${w.kr}</div>
        <p class="uz">${esc(w.uz)}</p>
        <span class="pill">${esc(w.tag)}</span>
        <ul class="points">${w.points.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
      </article>`;
    return `<section class="scene"><h2>Farqi nimada?</h2>
      <div class="cards">${card(d.w1, "b", 1)}${card(d.w2, "r", 2)}</div></section>`;
  }
  if (id === "examples") {
    let n = 0;
    const col = (w, cls) => `
      <div class="col ${cls}">
        <span class="chip">${w.kr}</span>
        ${w.examples.map(([a, hl, b, tr]) => { n++; return `
          <div class="ex reveal" data-step="${n}">
            <span class="num">${n}</span>
            <div><p class="kr" lang="ko">${esc(a)}<mark>${esc(hl)}</mark>${esc(b)}</p><p class="tr">${esc(tr)}</p></div>
          </div>`; }).join("")}
      </div>`;
    return `<section class="scene"><h2>Misollar</h2><div class="cols">${col(d.w1, "b")}${col(d.w2, "r")}</div></section>`;
  }
  if (id === "summary") return `
    <section class="scene summary"><h2>Eslab qoling</h2>
      <div class="rows">
        ${d.summary.map(([c, w], i) => `
          <div class="row ${i ? "r" : "b"} reveal" data-step="${i + 1}">
            <span class="dot"></span><span class="cond">${esc(c)}</span><span class="ans">→ ${w}</span>
          </div>`).join("")}
      </div>
    </section>`;
  const nextLabel = p < PAIRS.length - 1
    ? `Keyingi juftlik: ${PAIRS[p + 1].w1.kr} vs ${PAIRS[p + 1].w2.kr} →`
    : "Boshidan boshlash →";
  return `
    <section class="scene outro">
      <img class="mark pop" src="${LOGO}" alt="">
      <h2 class="pop d2">Foydali ma'lumotlar uchun bizga obuna bo'ling!</h2>
      <a class="ig pop d3" href="https://www.instagram.com/${HANDLE}/" target="_blank" rel="noopener"><img src="${IG}" alt="Instagram">@${HANDLE}</a>
      <button class="next-pair pop d3" type="button" id="nextPair">${nextLabel}</button>
    </section>`;
}

function render() {
  const key = state.p + ":" + state.s;
  if (key !== built) {
    stage.innerHTML = sceneHTML(state.p, state.s);
    built = key;
    const np = document.getElementById("nextPair");
    if (np) np.addEventListener("click", e => { e.stopPropagation(); goPair((state.p + 1) % PAIRS.length); });
  }
  stage.querySelectorAll(".reveal").forEach(el => el.classList.toggle("on", +el.dataset.step <= state.k));

  tabs.querySelectorAll(".tab").forEach((t, i) => t.setAttribute("aria-current", i === state.p ? "true" : "false"));
  document.querySelectorAll("#bars span").forEach((b, i) => {
    b.className = i < state.s ? "done" : i === state.s ? "now" : "";
  });
  const atEnd = state.p === PAIRS.length - 1 && state.s === SCENES.length - 1;
  document.getElementById("prev").disabled = state.p === 0 && state.s === 0 && state.k === 0;
  document.getElementById("next").disabled = atEnd;
  try { history.replaceState(null, "", "#" + (state.p + 1)); } catch (e) {}
}

function next() {
  const sc = SCENES[state.s];
  if (state.k < sc.steps) state.k++;
  else if (state.s < SCENES.length - 1) { state.s++; state.k = 0; }
  else if (state.p < PAIRS.length - 1) { state.p++; state.s = 0; state.k = 0; }
  render();
}
function prev() {
  if (state.k > 0) state.k--;
  else if (state.s > 0) { state.s--; state.k = SCENES[state.s].steps; }
  else if (state.p > 0) { state.p--; state.s = SCENES.length - 1; state.k = 0; }
  render();
}
function goPair(i) { state.p = i; state.s = 0; state.k = 0; built = ""; render(); stage.focus({ preventScroll: true }); }

PAIRS.forEach((d, i) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "tab";
  b.innerHTML = `<b>${i + 1}</b><span lang="ko">${d.w1.kr} · ${d.w2.kr}</span>`;
  b.addEventListener("click", () => goPair(i));
  tabs.appendChild(b);
});

stage.addEventListener("click", e => { if (!e.target.closest("a, button")) next(); });
document.getElementById("next").addEventListener("click", next);
document.getElementById("prev").addEventListener("click", prev);
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("button, a") && (e.key === " " || e.key === "Enter")) return;
  if (["ArrowRight", " ", "PageDown", "Enter"].includes(e.key)) { e.preventDefault(); next(); }
  else if (["ArrowLeft", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); prev(); }
});

const fromHash = parseInt((location.hash || "").slice(1), 10);
if (fromHash >= 1 && fromHash <= PAIRS.length) state.p = fromHash - 1;
window.addEventListener("hashchange", () => {
  const n = parseInt((location.hash || "").slice(1), 10);
  if (n >= 1 && n <= PAIRS.length && n - 1 !== state.p) goPair(n - 1);
});
render();
</script>
</body></html>
