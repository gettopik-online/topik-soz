<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GETTOPIK online — O'rta daraja so'zlari</title>
<style>
  :root{
    --bg:#EEF1F6; --card:#FFFFFF; --ink:#0E1320; --muted:#5B6478;
    --line:#D8DEE9; --accent:#067DF4; --ok:#127A4B; --no:#E91F3D; --red:#E91F3D;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    font-size:17px; line-height:1.7; display:flex; justify-content:center;
    padding:24px 16px 56px;
  }
  .wrap{width:100%;max-width:720px}
  header{margin-bottom:18px}
  .top{display:flex;align-items:center;gap:14px}
  .logo{background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px 9px;line-height:0;flex:none}
  .logo img{height:42px;width:auto;display:block}
  .brand{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600}
  h1 .accent{color:var(--red)}
  h1{font-size:30px;line-height:1.25;margin-top:6px;letter-spacing:-.02em}
  .lead{color:var(--muted);margin-top:8px}
  .who{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:15px;color:var(--muted)}
  .who b{color:var(--ink)}
  .link{background:none;border:0;color:var(--accent);font:inherit;font-size:15px;cursor:pointer;padding:0;text-decoration:underline}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px;margin-bottom:16px}
  h2{font-size:20px;margin-bottom:14px;letter-spacing:-.01em}
  .hint{color:var(--muted);font-size:15px}

  .sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
  .set{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:border-color .15s,transform .15s}
  @media (hover:hover){ .set:hover{border-color:var(--accent);transform:translateY(-2px)} }
  .set .n{font-size:22px;font-weight:700}
  .set .m{color:var(--muted);font-size:14px}

  .rounds{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;margin-top:6px}
  .round{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 10px;cursor:pointer;font:inherit;color:inherit;text-align:center}
  @media (hover:hover){ .round:hover{border-color:var(--accent)} }
  .round.done{border-color:var(--ok);color:var(--ok)}
  .round b{display:block;font-size:17px}
  .round span{font-size:13px;color:var(--muted)}

  .bar{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
  .step{font-size:14px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--card)}
  .step.on{border-color:var(--accent);color:var(--accent);font-weight:600}
  .prog{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:22px}
  .prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}

  .ko{font-size:44px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
  .uz{font-size:22px;margin-top:10px}
  .big-uz{font-size:32px;font-weight:600;line-height:1.4}

  .opts{display:grid;gap:12px;margin-top:20px}
  .opt{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:16px 18px;text-align:left;font:inherit;color:inherit;cursor:pointer}
  @media (hover:hover){ .opt:hover{border-color:var(--accent)} }
  .opt.ok{border-color:var(--ok);color:var(--ok);font-weight:600}
  .opt.no{border-color:var(--no);color:var(--no)}
  .opt:disabled{cursor:default}

  input[type=text]{width:100%;font:inherit;font-size:28px;padding:14px 16px;margin-top:16px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink)}
  input.name{font-size:20px}
  input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  input.ok{border-color:var(--ok)} input.no{border-color:var(--no)}

  .btn{background:var(--accent);color:#fff;border:0;border-radius:11px;padding:14px 24px;font:inherit;font-weight:600;cursor:pointer;margin-top:16px}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .btn:disabled{opacity:.45;cursor:default}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

  .fb{margin-top:16px;font-size:17px}
  .fb.ok{color:var(--ok)} .fb.no{color:var(--no)}

  .list{margin-top:8px}
  .list div{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line)}
  .list div:last-child{border-bottom:0}
  .list .k{font-weight:600}
  .list .v{color:var(--muted);text-align:right}

  .rank{width:100%;border-collapse:collapse;margin-top:6px}
  .rank td,.rank th{padding:10px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:16px}
  .rank th{font-size:14px;color:var(--muted);font-weight:600}
  .rank td.num{text-align:right;white-space:nowrap}
  .rank tr.me td{font-weight:700;color:var(--accent)}

  .score{font-size:40px;font-weight:700}
  .warn{background:#FFF6E5;border:1px solid #F0D9A8;color:#6B4E00;border-radius:11px;padding:12px 14px;font-size:14px;margin-bottom:16px}
  footer{color:var(--muted);font-size:14px;text-align:center;margin-top:26px}
  @media (max-width:520px){ .ko{font-size:34px} .big-uz{font-size:26px} h1{font-size:24px} }

  /* ============ MOCK 시험 ============ */
  .mockbar{position:sticky;top:0;z-index:20;background:var(--card);border:1px solid var(--line);border-radius:11px;
    padding:10px 16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .mockbar .t{font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
  .mockbar.low .t{color:var(--no)}
  .qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:14px}
  .qnum{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;background:var(--ink);
    color:#fff;border-radius:8px;font-weight:800;font-size:15px;margin-right:8px;flex:none}
  .qtext{font-size:17px;line-height:1.7}
  .passage{background:#F7F9FC;border:1px solid var(--line);border-radius:11px;padding:18px 20px;margin:12px 0;font-size:16px;line-height:1.85}
  .passage u{text-decoration:underline;text-decoration-thickness:2px}
  .adbox{border-radius:12px;padding:26px 20px;margin:12px 0;text-align:center;color:#fff;
    background:linear-gradient(135deg,#1B2A6B,#3457D5);box-shadow:0 6px 18px rgba(27,42,107,.25)}
  .adbox .t1{font-size:19px;font-weight:800;line-height:1.45}
  .adbox .t2{font-size:14px;margin-top:10px;opacity:.85}
  .posterbox{border:2px solid var(--ink);border-radius:10px;padding:18px 22px;margin:12px 0}
  .posterbox h4{text-align:center;font-size:16px;margin-bottom:12px;letter-spacing:-.01em}
  .posterbox .pl{font-size:15px;line-height:2;padding-left:4px}
  .posterbox .note{margin-top:10px;font-size:13.5px;color:var(--muted)}
  .headlinebox{border:2px solid var(--ink);border-radius:10px;padding:18px;margin:12px 0;text-align:center;font-weight:800;font-size:17px}
  .chartbox{border:1px solid var(--line);border-radius:11px;padding:20px 18px 12px;margin:12px 0}
  .chartbox h4{text-align:center;font-size:15px;margin-bottom:16px;font-weight:700}
  .chartbox .unit{text-align:right;font-size:12px;color:var(--muted);margin-bottom:4px}
  .chartbars{display:flex;align-items:flex-end;gap:8px;height:170px;padding:0 4px}
  .chartbars .b{flex:1;background:#35C3F3;border-radius:4px 4px 0 0;position:relative;min-height:2px}
  .chartbars .b span{position:absolute;left:50%;top:-22px;transform:translateX(-50%);font-size:12.5px;font-weight:700;white-space:nowrap}
  .chartlabels{display:flex;gap:8px;padding:0 4px;margin-top:8px}
  .chartlabels div{flex:1;text-align:center;font-size:12.5px;color:var(--muted)}
  .orderlist div{background:#F7F9FC;border:1px solid var(--line);border-radius:9px;padding:11px 14px;margin-bottom:7px;font-size:15px}
  .insmark{display:inline-flex;align-items:center;justify-content:center;width:23px;height:23px;border:1.5px solid var(--accent);
    border-radius:50%;color:var(--accent);font-size:12.5px;font-weight:800;margin:0 1px;vertical-align:middle}
  .insgiven{background:#EAF3FF;border:1px solid var(--accent);border-radius:10px;padding:13px 16px;margin-bottom:12px;font-weight:600;font-size:15.5px}
  .rev{border-top:3px solid var(--line);margin-top:10px;padding-top:14px}
  .rev.ok{border-color:var(--ok)} .rev.no{border-color:var(--no)}
  .rev .a{font-size:14.5px;margin-top:6px}
  .rev .a b{font-weight:700}
  .opt.picked{border-color:var(--accent);border-width:2px;font-weight:600}
  .mocktoast{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-140%);z-index:60;
    background:var(--ink);color:#fff;border-radius:12px;padding:14px 22px;font-weight:700;font-size:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);transition:transform .35s ease;pointer-events:none;max-width:92vw;text-align:center}
  .mocktoast.show{transform:translateX(-50%) translateY(0)}
  .mocktoast.urgent{background:var(--no)}
  .mocknote{background:#FFF7E6;border:1px solid #F0C36D;border-radius:11px;padding:14px 16px;margin-bottom:14px;font-size:15px}
  .mockgroup .ins{font-weight:700;color:var(--ink);margin-bottom:4px}
  .mockq + .mockq{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
</style>
</head>

<script>
/* ============ bo'limlar (43~44 va 46~47) ============ */
// SECTIONS data2.js dan keladi. Har set'ga secId qo'shamiz, global SETS = hamma set.
SECTIONS.forEach(sec=>sec.sets.forEach(s=>{ s.secId=sec.id; s.uid=sec.id+'-'+s.id; }));
const ALLSETS = SECTIONS.flatMap(s=>s.sets);
const TYPES = [
  {id:'listen', label:'듣기', uz:'Tinglash'},
  {id:'read',   label:'읽기', uz:"O'qish"},
];
let TYPE = null;                          // joriy tur (listen/read)
let SEC  = null;                          // joriy bo'lim
function typeSections(t){ return SECTIONS.filter(s=>s.type===t); }
function typeLabel(t){ const x=TYPES.find(y=>y.id===t); return x.label+' · '+x.uz; }
function curSets(){ return SECTIONS.find(x=>x.id===SEC).sets; }
function secLabel(id){ return SECTIONS.find(x=>x.id===id).label; }
function secType(id){ return SECTIONS.find(x=>x.id===id).type; }
function setsOfType(t){ return typeSections(t).flatMap(s=>s.sets); }

/* ============ server (umumiy reyting) ============ */
const API='https://gogeup-soz-reyting.online-koreys-tili.workers.dev';
const GAME='topik-soz-v4';   // so'zlar almashgani uchun reyting noldan
const TOPS={}, TOPERR={};              // reyting keshi: game nomi -> qatorlar

// reyting nomlari: umumiy / tur / bo'lim
function gTotal(){ return GAME; }
function gType(t){ return GAME+'-'+t; }
function gSec(id){ return GAME+'-s-'+id; }

async function post(game, ok, done){
  try{
    await fetch(API+'/score',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({game,name:DB.current,ok,done})});
  }catch(e){ /* internet yo'q — natija telefonda saqlanib turaveradi */ }
}
async function pushScore(){
  const t=userScore(DB.current);
  const jobs=[ post(gTotal(), t.ok, t.done) ];
  TYPES.forEach(x=>{ const s=userScore(DB.current,{type:x.id}); jobs.push(post(gType(x.id), s.ok, s.done)); });
  SECTIONS.forEach(sec=>{ const s=userScore(DB.current,{sec:sec.id}); jobs.push(post(gSec(sec.id), s.ok, s.done)); });
  await Promise.all(jobs);
}
async function fetchTop(game){
  try{
    const r=await fetch(API+'/top?game='+game);
    const d=await r.json(); TOPS[game]=d.rows||[]; TOPERR[game]=false;
  }catch(e){ TOPS[game]=null; TOPERR[game]=true; }
}

/* ============ saqlash ============ */
const KEY='gettopik_soz_v4';   // v2 — so'zlar almashgani uchun eski natijalar tozalanadi
let DB={users:{},current:null};
let SAVE_OK=true;

function load(){
  try{ const r=localStorage.getItem(KEY); if(r) DB=JSON.parse(r); }
  catch(e){ SAVE_OK=false; }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch(e){ SAVE_OK=false; }
}
function blankUser(){
  const st={}; ALLSETS.forEach(s=>st[s.uid]={});
  return {stats:st, done:{}, last:null};
}
function U(){
  if(!DB.current) return null;
  let u=DB.users[DB.current];
  if(!u){ u=DB.users[DB.current]=blankUser(); }
  ALLSETS.forEach(s=>{
    let a=u.stats[s.uid];
    if(!a){ u.stats[s.uid]={}; return; }
    if(Array.isArray(a)){                      // eski format (indeks bo'yicha) -> so'z bo'yicha
      const o={}; a.forEach((v,i)=>{ if(v!==null && s.words[i]) o[s.words[i][0]]=v; });
      u.stats[s.uid]=o;
    }
  });
  if(!u.done) u.done={};
  return u;
}

/* ============ yordamchi ============ */
const app=document.getElementById('app');
const whoEl=document.getElementById('who');
const state={set:null, round:null, mode:'round', list:[], i:0, correct:0, wrong:[], miss:{}};

function chunk(arr,n){
  const r=[]; for(let i=0;i<arr.length;i+=n) r.push(arr.slice(i,i+n));
  if(r.length>1 && r[r.length-1].length<=4){ const t=r.pop(); r[r.length-1]=r[r.length-1].concat(t); }
  return r;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function rounds(set){ return chunk(set.words.map(w=>({ko:w[0],uz:w[1],uid:set.uid})),10); }
function norm(s){return s.replace(/\s+/g,'').trim();}
function accepted(ko){ const v=[ko, ko.replace(/\([^)]*\)/g,''), ko.replace(/[()]/g,'')]; return [...new Set(v.map(norm).filter(Boolean))]; }
function setByUid(uid){ return ALLSETS.find(s=>s.uid===uid); }
function setById(id){ return curSets().find(s=>s.id===id); }   // joriy bo'lim ichida
// stat: har so'z koreyscha kaliti bo'yicha saqlanadi -> yangi so'z qo'shilsa eski natija saqlanadi
function setStat(s){
  const a=U().stats[s.uid]; let ok=0,no=0,done=0;
  s.words.forEach(w=>{ const v=a[w[0]]; if(v===true){ok++;done++;} else if(v===false){no++;done++;} });
  return {ok,no,done,all:s.words.length};
}
function secStat(){ let ok=0,no=0,done=0,all=0; curSets().forEach(s=>{const t=setStat(s);ok+=t.ok;no+=t.no;done+=t.done;all+=t.all;}); return {ok,no,done,all}; }
function totalStat(){ let ok=0,no=0,done=0,all=0; ALLSETS.forEach(s=>{const t=setStat(s);ok+=t.ok;no+=t.no;done+=t.done;all+=t.all;}); return {ok,no,done,all}; }
function wrongOf(s){
  const a=U().stats[s.uid], out=[];
  s.words.forEach(w=>{ if(a[w[0]]===false) out.push({ko:w[0],uz:w[1],uid:s.uid}); });
  return out;
}
function secWrong(){ return curSets().flatMap(s=>wrongOf(s)); }
function userScore(name, filt){
  const u=DB.users[name]; if(!u) return {ok:0,done:0,all:0};
  let list=ALLSETS;
  if(filt && filt.type) list=setsOfType(filt.type);
  if(filt && filt.sec)  list=SECTIONS.find(x=>x.id===filt.sec).sets;
  let ok=0,done=0,all=0;
  list.forEach(s=>{ all+=s.words.length; const a=u.stats[s.uid]; if(!a||Array.isArray(a)) return;
    s.words.forEach(w=>{ const v=a[w[0]]; if(v!==undefined&&v!==null){done++; if(v===true) ok++;} }); });
  return {ok,done,all};
}
// tur bo'yicha statistika
function typeStat(t){ let ok=0,no=0,done=0,all=0; setsOfType(t).forEach(s=>{const x=setStat(s);ok+=x.ok;no+=x.no;done+=x.done;all+=x.all;}); return {ok,no,done,all}; }
function typeWrong(t){ return setsOfType(t).flatMap(s=>wrongOf(s)); }

/* ============ ism ============ */
function screenName(){
  whoEl.innerHTML='';
  app.innerHTML=`
    ${SAVE_OK?'':'<div class="warn">Bu brauzerda natija saqlanmaydi. Saytni oddiy oynada oching (yashirin rejim emas).</div>'}
    <div class="card">
      <h2>Ismingizni yozing</h2>
      <p class="hint">Natijangiz shu ism ostida saqlanadi. Keyingi safar shu ismni tanlab davom etasiz.</p>
      <input type="text" class="name" id="nm" maxlength="24" placeholder="Ism Familiya" autocomplete="off">
      <div class="row"><button class="btn" id="go">Boshlash</button></div>
    </div>
    ${Object.keys(DB.users).length?`
    <div class="card">
      <h2>Avvalgi ismlar</h2>
      <div class="row">
        ${Object.keys(DB.users).map(n=>`<button class="btn ghost" data-n="${n}">${n}</button>`).join('')}
      </div>
    </div>`:''}`;
  const nm=document.getElementById('nm'); nm.focus();
  const go=()=>{
    const v=nm.value.trim(); if(!v) {nm.focus(); return;}
    DB.current=v; if(!DB.users[v]) DB.users[v]=blankUser(); save(); screenTypes();
  };
  document.getElementById('go').onclick=go;
  nm.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{DB.current=b.dataset.n;save();screenTypes();});
}
function whoBar(level){   // level: 0=tur tanlash, 1=bo'limlar, 2=variantlar/ichkari
  whoEl.innerHTML=`<span>O'quvchi: <b>${DB.current}</b></span>
    ${level>=1?`<button class="link" id="navtype">듣기 / 읽기</button>`:''}
    ${level>=2?`<button class="link" id="navsec">${typeLabel(TYPE).split(' · ')[0]} bo'limlari</button>`:''}
    <button class="link" id="chg">ismni almashtirish</button>`;
  document.getElementById('chg').onclick=()=>{DB.current=null;save();screenName();};
  const tt=document.getElementById('navtype'); if(tt) tt.onclick=screenTypes;
  const ts=document.getElementById('navsec'); if(ts) ts.onclick=screenSections;
}

/* ============ 1-ekran: 듣기 / 읽기 ============ */
function screenTypes(){
  whoBar(0);
  const t=totalStat();

function rankCard(game, title, total){
  const rows=TOPS[game], err=TOPERR[game];
  let body;
  if(rows===undefined && !err) body='<p class="hint">Yuklanmoqda...</p>';
  else if(err) body='<p class="hint">Reytingni yuklab bo\'lmadi. Internetni tekshiring.</p>';
  else if(!rows || !rows.length) body='<p class="hint">Hali hech kim natija yubormagan. Birinchi bo\'ling.</p>';
  else body=`<table class="rank">
        <tr><th>#</th><th>Ism</th><th class="num">To'g'ri</th><th class="num">Ishlangan</th></tr>
        ${rows.map((r,i)=>`<tr class="${r.name===DB.current?'me':''}">
          <td>${i+1}</td><td>${r.name}</td><td class="num">${r.ok}</td><td class="num">${r.done} / ${total}</td></tr>`).join('')}
      </table>`;
  return `
    <div class="card">
      <h2>${title}</h2>
      <p class="hint">Raund tugagach natijangiz avtomatik yuboriladi.</p>
      ${body}
      <button class="btn ghost" id="reload" data-g="${game}">Yangilash</button>
    </div>`;
}
// reytingni kerak bo'lganda yuklash + Yangilash tugmasi
function wireRank(game, redraw){
  if(TOPS[game]===undefined && !TOPERR[game]) fetchTop(game).then(()=>{ if(document.getElementById('reload')) redraw(); });
  const rl=document.getElementById('reload');
  if(rl) rl.onclick=async()=>{ delete TOPS[game]; delete TOPERR[game]; redraw(); await fetchTop(game); redraw(); };
}


/* ============ raundlar ============ */
function screenRounds(){
  whoBar(2);
  const rs=rounds(state.set), st=setStat(state.set), w=wrongOf(state.set), u=U();
  app.innerHTML=`
    <div class="card">
      <h2>${state.set.title} — raundlar</h2>
      <p class="hint">${state.set.sub} · ${st.ok}/${st.all} to'g'ri · ${st.no} xato</p>
      <div class="rounds">
        ${rs.map((r,i)=>{const rdone=r.every(w=>U().stats[state.set.uid][w.ko]!==undefined);return `<button class="round ${rdone?'done':''}" data-i="${i}">
          <b>${i+1}-raund</b><span>${r.length} ta so'z</span></button>`}).join('')}
      </div>
      <div class="row">
        ${w.length?`<button class="btn" id="rev">Xato so'zlarni takrorlash (${w.length} ta)</button>`:''}
        <button class="btn ghost" id="back">Variantlar</button>
      </div>
    </div>`;
  app.querySelectorAll('.round').forEach(b=>b.onclick=()=>startRound(+b.dataset.i));
  const rv=document.getElementById('rev'); if(rv) rv.onclick=()=>startReview(w, state.set);
  document.getElementById('back').onclick=screenSets;
}

function startRound(r){
  state.mode='round'; state.round=r; state.list=rounds(state.set)[r];
  state.i=0; state.correct=0; state.wrong=[]; state.miss={};
  const u=U(); u.last={sec:SEC, uid:state.set.uid, round:r}; save();
  phase1();
}
function startReview(list, set){
  state.mode='review'; state.set=set; state.round=null; state.list=shuffle(list);
  state.i=0; state.correct=0; state.wrong=[]; state.miss={};
  phase1();
}
function title(){ return state.mode==='review' ? 'Xatolarni takrorlash' : state.set.title+' · '+(state.round+1)+'-raund'; }
function backScreen(){ return state.mode==='review' && !state.set ? screenSets : screenRounds; }

function bar(phase, pct){
  const names=["Tanishtiruv","Variant tanlash","Yozish"];
  return `<div class="bar">
      <div class="step">${title()}</div>
      ${names.map((n,i)=>`<div class="step ${i+1===phase?'on':''}">${i+1}. ${n}</div>`).join('')}
    </div>
    <div class="prog"><i style="width:${pct}%"></i></div>`;
}
function markMiss(i, ok){ if(!ok) state.miss[i]=true; }
function commit(){
  const u=U();
  state.list.forEach((w,j)=>{ u.stats[w.uid][w.ko] = !state.miss[j]; });
  save();
  pushScore().then(()=>{ Object.keys(TOPS).forEach(k=>delete TOPS[k]); Object.keys(TOPERR).forEach(k=>delete TOPERR[k]); });
}

/* ---- 1: tanishtiruv ---- */
function phase1(){
  const w=state.list[state.i];
  app.innerHTML=`
    ${bar(1, state.i/state.list.length*100)}
    <div class="card" style="text-align:center;padding:44px 26px">
      <div class="hint">${state.i+1} / ${state.list.length}</div>
      <div class="ko" style="margin-top:14px">${w.ko}</div>
      <div class="uz">${w.uz}</div>
    </div>
    <div class="row">
      <button class="btn" id="next">${state.i+1===state.list.length?'Mashqni boshlash':"Keyingi so'z"}</button>
      <button class="btn ghost" id="prev" ${state.i===0?'disabled':''}>Orqaga</button>
      <button class="btn ghost" id="exit">Chiqish</button>
    </div>`;
  document.getElementById('next').onclick=()=>{
    if(state.i+1===state.list.length){ state.i=0;state.correct=0;state.wrong=[];phase2(); }
    else { state.i++; phase1(); }
  };
  document.getElementById('prev').onclick=()=>{ if(state.i>0){state.i--;phase1();} };
  document.getElementById('exit').onclick=backScreen();
}

/* ---- 2: variant tanlash ---- */
function makeOptions(w){
  const seen=new Set([w.uz]); const pick=[];
  const take=list=>{ for(const x of shuffle(list)){ if(pick.length>=3) return; const m=x.uz||x[1]; if(!seen.has(m)){ seen.add(m); pick.push(m); } } };
  take(state.list);
  take(setByUid(w.uid).words.map(x=>({uz:x[1]})));
  return shuffle(pick.concat([w.uz]));
}
function phase2(){
  const w=state.list[state.i], opts=makeOptions(w);
  app.innerHTML=`
    ${bar(2, state.i/state.list.length*100)}
    <div class="card">
      <div class="hint">${state.i+1} / ${state.list.length} · to'g'ri: ${state.correct}</div>
      <div class="ko" style="margin-top:10px">${w.ko}</div>
      <p class="hint" style="margin-top:8px">Ma'nosini tanlang.</p>
      <div class="opts">${opts.map((o,i)=>`<button class="opt" data-o="${i}">${o}</button>`).join('')}</div>
      <div class="fb" id="fb"></div>
    </div>
    <button class="btn ghost" id="exit">Chiqish</button>`;
  document.getElementById('exit').onclick=backScreen();
  const btns=[...app.querySelectorAll('.opt')];
  btns.forEach((b,i)=>b.onclick=()=>{
    btns.forEach(x=>x.disabled=true);
    const ok=opts[i]===w.uz;
    b.classList.add(ok?'ok':'no');
    if(!ok){ btns[opts.indexOf(w.uz)].classList.add('ok'); state.wrong.push(w); } else state.correct++;
    markMiss(state.i, ok);
    const fb=document.getElementById('fb');
    fb.className='fb '+(ok?'ok':'no');
    fb.innerHTML=ok?"To'g'ri.":`Noto'g'ri. <b>${w.ko}</b> — ${w.uz}`;
    setTimeout(()=>{
      if(state.i+1===state.list.length){ state.i=0;state.correct=0;state.wrong=[];phase3(); }
      else { state.i++; phase2(); }
    }, ok?650:1500);
  });
}

/* ---- 3: yozish ---- */
function phase3(){
  const w=state.list[state.i];
  app.innerHTML=`
    ${bar(3, state.i/state.list.length*100)}
    <div class="card">
      <div class="hint">${state.i+1} / ${state.list.length} · to'g'ri: ${state.correct}</div>
      <div class="big-uz" style="margin-top:10px">${w.uz}</div>
      <p class="hint" style="margin-top:8px">Koreyschasini yozing.${/[()]/.test(w.ko)?" Qavsli qism ixtiyoriy.":""}</p>
      <input type="text" id="in" name="k${Math.random().toString(36).slice(2)}" autocomplete="off" autocorrect="off"
             autocapitalize="off" spellcheck="false" data-form-type="other" data-lpignore="true" placeholder="한국어">
      <div class="row">
        <button class="btn" id="check">Tekshirish</button>
        <button class="btn ghost" id="show">Javobni ko'rsatish</button>
      </div>
      <div class="fb" id="fb"></div>
    </div>
    <button class="btn ghost" id="exit">Chiqish</button>`;
  document.getElementById('exit').onclick=backScreen();
  const inp=document.getElementById('in'); inp.focus();
  const fb=document.getElementById('fb');
  let answered=false;
  function done(ok){
    answered=true; inp.disabled=true; inp.classList.add(ok?'ok':'no');
    fb.className='fb '+(ok?'ok':'no');
    fb.innerHTML=ok?"To'g'ri.":`To'g'ri javob: <b>${w.ko}</b>`;
    if(ok) state.correct++; else state.wrong.push(w);
    markMiss(state.i, ok);
    setTimeout(()=>{
      if(state.i+1===state.list.length){ commit(); finish(); }
      else { state.i++; phase3(); }
    }, ok?650:1800);
  }
  document.getElementById('check').onclick=()=>{
    if(answered) return;
    if(!inp.value.trim()){ inp.focus(); return; }
    done(accepted(w.ko).includes(norm(inp.value)));
  };
  document.getElementById('show').onclick=()=>{ if(!answered) done(false); };
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('check').click(); });
}

/* ---- yakun ---- */
function finish(){
  const n=state.list.length, pct=Math.round(state.correct/n*100);
  const missed=state.list.filter((w,j)=>state.miss[j]);
  const rs=state.set?rounds(state.set):[];
  const hasNext=state.mode==='round' && state.round+1<rs.length;
  app.innerHTML=`
    <div class="card">
      <h2>${state.mode==='review'?'Takrorlash tugadi':state.round+1+'-raund tugadi'}</h2>
      <div class="score">${state.correct} / ${n}</div>
      <p class="hint">Yozish bosqichi — ${pct}%</p>
      ${missed.length?`
        <h2 style="margin-top:24px">Xato qilgan so'zlaringiz</h2>
        <div class="list">${missed.map(w=>`<div><span class="k">${w.ko}</span><span class="v">${w.uz}</span></div>`).join('')}</div>
        <button class="btn" id="onlywrong">Faqat shu so'zlarni takrorlash (${missed.length} ta)</button>
        `:`<p class="hint" style="margin-top:14px">Hamma so'z to'g'ri.</p>`}
      <div class="row">
        <button class="btn ghost" id="again">${state.mode==='review'?'Qaytadan':'Raundni qayta yechish'}</button>
        ${hasNext?`<button class="btn ghost" id="next">${state.round+2}-raund</button>`:''}
        <button class="btn ghost" id="exit">${state.set?'Raundlar':"Variantlar"}</button>
      </div>
    </div>
    ${setDoneCard()}`;
  const ow=document.getElementById('onlywrong'); if(ow) ow.onclick=()=>startReview(missed, state.set);
  const ag=document.getElementById('again');
  ag.onclick=()=> state.mode==='review' ? startReview(state.list, state.set) : startRound(state.round);
  const nx=document.getElementById('next'); if(nx) nx.onclick=()=>startRound(state.round+1);
  document.getElementById('exit').onclick=backScreen();
  const ts=document.getElementById('tosets'); if(ts) ts.onclick=screenSets;
}
function setDoneCard(){
  if(state.mode!=='round') return '';
  const st=setStat(state.set); if(st.done<st.all) return '';
  const t=secStat();
  return `<div class="card">
      <h2>${state.set.title} tugadi</h2>
      <div class="score">${st.ok} / ${st.all}</div>
      <p class="hint">${st.no} ta xato</p>
      <h2 style="margin-top:22px">${secLabel(SEC)} — statistika</h2>
      <div class="score">${t.ok} / ${t.all}</div>
      <p class="hint">${t.no} ta xato · ${t.all-t.ok-t.no} ta so'z hali ishlanmagan</p>
      <button class="btn" id="tosets">Variantlarga qaytish</button>
    </div>`;
}

      { num:31, content:{kind:"passage", text:"과거에는 위생과 환경 개선에 신경 쓰지 않아서 생기는 병이 많았는데, 생활 수준이 향상된 지금은 그러한 경우가 많이 없어졌다. 그러나 병원을 찾는 사람들은 여전히 줄지 않고 있다. 사람들은 이제 병에 걸렸기 때문에 병원을 찾는 것이 아니라, (　　　　) 의사를 만나기 때문이다. 이러한 시대 흐름에 맞추어 의료계에서도 질병 예방 및 건강 관리에 힘을 더 쏟고 있다."},

        explain:["본문에서 언급되지 않은 내용이다.","본문과 관련이 없다.","본문 내용과 관련이 없다.","(정답) 뒤 문장의 ‘질병 예방 및 건강 관리’와 연결되며, 예방을 위해 병원을 찾는다는 문맥과 일치한다."] }
    ]},

  { instruction:"※ [32~34] 다음을 읽고 글의 내용과 같은 것을 고르십시오. (각 2점)",
    questions:[
      { num:32, content:{kind:"passage", text:"같은 분야의 몇몇 가게가 가격 경쟁을 벌일 경우 그 경쟁은 점점 치열해져서 결국 한 가게만 남고 모두 문을 닫게 된다. 이것을 치킨 게임이라고 하는데, 이는 발전을 위한 경쟁을 허용하는 자본주의 사회에서 종종 일어나는 현상이다. 그러나 이런 치킨 게임을 하게 되면 많은 사람들이 피해를 볼 수 있기 때문에 정부가 나서서 조정할 필요가 있다. 과도한 경쟁을 피하기 위해 가격을 일정한 선 아래로는 떨어뜨릴 수 없도록 규제하거나 그 분야의 업체들이 서로 협의할 수 있는 자리를 마련해 주는 것이다."},
        options:["자본주의 사회에서의 자유로운 경쟁을 치킨 게임이라고 한다.","가격을 조정하기 위해 치킨 게임을 일정한 간격으로 해야 한다.","정부는 치킨 게임을 막기 위해 어느 정도의 규제를 하기도 한다.","정부는 자본주의 유지를 위해 기업들 간의 경쟁에 관여해서는 안 된다."], correct:2,
        explain:["자유로운 경쟁 자체가 아니라 극단적인 가격 경쟁 상황을 치킨 게임이라고 한다.","치킨 게임을 정기적으로 해야 한다는 내용은 없다.","(정답) ‘가격을 일정한 선 아래로는 떨어뜨릴 수 없도록 규제’한다는 내용과 일치한다.","정부가 나서서 조정할 필요가 있다고 했으므로 반대된다."] },
      { num:33, content:{kind:"passage", text:"한국의 헌법 중 가장 첫 번째 내용은 ‘대한민국은 민주 공화국이다.’이다. 법 중에서 가장 중요한 법이 헌법이고, 그 헌법에서 가장 먼저 나오는 내용이기 때문에, 이것은 대한민국의 정체성을 나타내는 아주 중요한 내용이다. 민주주의란 나라의 중요한 의사 결정을 국민들이 직접 하거나 국민들이 뽑은 대표가 하는 것을 말한다. 그리고 공화국이란 국가의 주권이 국민에게 있다는 것을 의미한다. 그러니까 이것은 대한민국의 주권이 국민에게 있고, 직접 또는 간접적으로 국민이 국가의 의사 결정을 한다는 뜻이다."},
        options:["헌법은 대한민국 법의 첫 번째 내용을 의미한다.","대한민국의 주권은 국민이 뽑은 대표에게 있다.","국가 차원의 의사 결정은 항상 국민들이 직접 한다.","민주주의는 국민의 뜻에 따라 의사를 결정하는 것이다."], correct:3,
        explain:["헌법이 법 중에서 가장 중요한 법이라는 것이지, 헌법이 법의 ‘첫 번째 내용’이라는 설명은 잘못됐다.","주권은 국민에게 있고 대표는 의사 결정을 대신할 뿐이다.","직접 또는 간접적으로 한다고 했으므로 ‘항상 직접’은 틀리다.","(정답) 민주주의는 국민이 직접 또는 대표를 통해 의사 결정을 하는 것이므로 일치한다."] },
      { num:34, content:{kind:"passage", text:"냉장고는 낮은 온도를 유지해서 신선함을 유지할 수 있게 해 주는 전자 제품이다. 냉장고의 원리는 냉매가 액체에서 기체로 변화하는 과정 중에 주변의 열을 빼앗아 가서 냉장고 안의 온도를 낮추는 것이다. 처음에는 냉매로 암모니아나 이산화황을 사용했으나 이것들은 악취가 심해서 프레온으로 바꾸었다. 그런데 프레온은 오존을 파괴하기 때문에 다시 새로운 물질을 찾았고, 그렇게 찾아낸 냉매가 바로 지금 사용되고 있는 HCFC이다."},
        options:["프레온은 악취가 심해서 냉매로 사용하지 않았다.","냉장고 안의 온도가 변하면 냉매의 상태가 변한다.","오존을 보호하기 위해 냉매로 사용된 물질을 바꾸었다.","환경을 위해서 냉매로 사용할 새로운 물질을 찾고 있다."], correct:2,
        explain:["악취 때문에 바뀐 것은 암모니아·이산화황이며, 프레온은 오존 파괴 때문에 바뀐 것이다.","냉매 상태 변화가 온도를 낮추는 원인이지, 온도 변화가 냉매 상태를 바꾸는 것이 아니다(인과관계 반대).","(정답) 프레온이 오존을 파괴해서 새로운 물질(HCFC)로 바꾸었다는 내용과 일치한다.","현재 HCFC를 사용하고 있다고 했으므로 ‘찾고 있다’는 틀리다."] }
    ]},

  { instruction:"※ [35~38] 다음을 읽고 글의 주제로 가장 알맞은 것을 고르십시오. (각 2점)",
    questions:[
      { num:35, content:{kind:"passage", text:"어떤 정보를 전달할 때는 여러 가지 것들을 고려해야 한다. 정확성, 체계성 등도 중요하지만 가장 먼저 생각해야 하는 것은 전달력이다. 정보를 전달하고자 하는 자가 어떤 것을 말했느냐는 사실 그렇게 중요하지 않다. 중요한 것은 정보를 전달받는 사람이 무엇을 들었느냐이다. 아무리 정확하고 체계적으로 구성된 정보라고 하더라도 전달받는 사람이 집중하기 어렵거나 오해하기 쉽다면 정보 전달이 제대로 이루어질 수 없기 때문이다."},
        options:["여러 가지 정보를 한 번에 전달하는 것이 가장 중요하다.","정보는 정확하고 체계적으로 구성해서 전달할 수 있어야 한다.","어떤 것을 전달할지 결정하는 과정에 더 많은 노력을 기울여야 한다.","효과적인 정보 전달을 위해 전달받는 사람의 입장을 더 생각해야 한다."], correct:3,
        explain:["한 번에 여러 정보를 전달하라는 내용이 아니다.","정확성·체계성도 중요하지만 ‘가장 먼저’는 전달력이라 했으므로 핵심 주제가 아니다.","무엇을 전달할지가 아니라 어떻게 전달받는지가 중요하다고 했다.","(정답) ‘전달받는 사람이 무엇을 들었느냐가 중요하다’는 것이 핵심 주제이다."] },
      { num:36, content:{kind:"passage", text:"외국어를 습득할 때 모국어는 도움이 될까, 아니면 방해가 될까? 연구자들의 말에 따르면 외국어와 모국어의 공통점이 있을 때는 모국어가 외국어 학습에 도움이 되는 반면에, 둘 사이에 다른 점이 있는 경우에는 모국어가 외국어 학습에 방해가 된다고 한다. 즉 모국어를 완전히 익힌 후에 외국어를 배우는 것이 어떤 면에서는 효율적일 수 있지만, 또 다른 면에서는 부정적으로 작용할 수도 있다는 것이다."},
        options:["외국어를 배울 때 모국어를 많이 활용하는 것이 좋다.","외국어와 모국어를 동시에 배우는 것이 가장 효율적이다.","모국어를 완전히 익히기 전에 외국어 학습을 시작하는 게 좋다.","모국어가 외국어 공부에 좋은 영향을 미칠 때도 있고 아닐 때도 있다."], correct:3,
        explain:["공통점이 있을 때만 도움이 되므로 항상 활용하는 것이 좋다고 할 수 없다.","동시에 배우는 것에 대한 언급은 없다.","완전히 익힌 후 배우는 것의 장단점을 설명했을 뿐, 그 전에 시작하라는 주장은 아니다.","(정답) 공통점이 있으면 도움이 되고 다른 점이 있으면 방해가 된다는, 상황에 따라 다르다는 것이 주제이다."] },
      { num:37, content:{kind:"passage", text:"사후 세계를 배경으로 한 영화 〈신과 함께〉는 1,400만 관객을 동원했다. 그리고 직장인들의 애환을 그린 드라마 〈미생〉은 상당한 시청률을 기록했다. 이 두 작품의 공통점은 웹툰을 원작으로 했다는 것이다. 웹툰이란 웹과 카툰을 합친 말로 웹을 통해 보는 만화를 뜻한다. 인터넷의 발달로 만화책 출판 시장은 크게 축소되었지만 웹툰이 새로운 대중문화의 한 분야로 자리 잡았고, 이제는 영화, 드라마, 굿즈 등 다양한 분야에서 큰 영향을 끼치고 있는 것이다."},
        options:["웹툰은 대중문화의 중요한 한 부분을 차지하고 있다.","인터넷의 발달로 영화, 드라마 시장이 많이 축소되었다.","웹툰을 원작으로 영화나 드라마를 제작하면 성공할 수 있다.","인터넷 보급으로 인해 여러 분야의 산업이 위기를 겪고 있다."], correct:0,
        explain:["(정답) 웹툰이 영화·드라마·굿즈 등 다양한 분야에 큰 영향을 끼치고 있다는 것이 핵심 주제이다.","축소된 것은 만화책 출판 시장이지 영화·드라마 시장이 아니다.","두 사례만으로 ‘항상 성공한다’고 일반화할 수 없다.","만화책 시장 축소는 언급되었지만 ‘여러 분야가 위기를 겪는다’는 주제는 아니며 오히려 웹툰은 성장했다."] },
      { num:38, content:{kind:"passage", text:"한 도시의 범죄율이 증가하자 그 도시의 시장이 엉뚱한 대책을 내놓았다. 무기 소지를 금지하거나 경찰들을 늘린 것이 아니라 지하철 무임승차 단속을 강화하고 거리에 쓰레기를 버리는 사람들에게 벌금을 내게 하는 등 아주 사소한 것들에 신경 쓴 것이다. 그런데 얼마 후 놀랍게도 이 도시의 범죄율은 급격히 줄어들었다. 가장 기본적인 것들부터 변화시키자 도시 전체의 분위기가 바뀌고 시민 의식이 높아진 것이다."},
        options:["경찰의 수를 늘리는 것이 범죄를 줄이는 데 가장 효과적이다.","큰 변화를 일으키기 위해서는 가장 기초적인 것부터 바꿔야 한다.","일반 시민도 무기를 갖게 하는 것은 범죄율 증가의 원인이 될 수 있다.","무임승차, 쓰레기 투기 등을 확실히 막기 위해서는 경찰력이 필요하다."], correct:1,
        explain:["경찰 수를 늘린 것이 아니라 사소한 것들을 단속해서 효과를 본 사례이다.","(정답) ‘가장 기본적인 것들부터 변화시키자’ 범죄율이 줄었다는 것이 핵심 주제이다.","무기 소지 금지가 아니라 다른 사소한 대책으로 효과를 봤다는 내용이다.","경찰력이 아니라 무임승차·쓰레기 단속이라는 사소한 정책으로 효과를 봤다."] }
    ]},

  { instruction:"※ [39~41] 주어진 문장이 들어갈 곳으로 가장 알맞은 곳을 고르십시오. (각 2점)",
    questions:[
      { num:39, content:{kind:"insert", given:"그런데 이러한 의약 분업은 조선 시대에도 확실하게 이루어졌었다.",
          text:"한국에서는 2000년 7월에 의사와 약사의 역할을 완전히 나누었다. (㉠) 그전에는 의사와 약사 모두 진료와 약 처방을 병행했으나 의약 분업이 시행되면서 병원에서 의사가 진료를 하고 약을 처방하면 그 처방에 따라 약국에서 약사가 약을 만들어 주는 것이다. (㉡) 의사와 약사 모두 자기 전문 분야의 일에 집중하게 하자는 취지였다. (㉢) 하지만 당시의 의약 분업의 이유는 지금과는 좀 달랐다. (㉣) 조선 시대의 의원들은 너무 가난해서 약재를 준비할 만큼의 돈이 없었기 때문에 환자들에게 처방전만 써 주고 약은 재료가 충분히 구비되어 있는 약방에 맡길 수밖에 없었던 것이다."},
        options:["㉠","㉡","㉢","㉣"], correct:2,
        explain:["여기에 넣으면 2000년 의약 분업 설명 중간에 조선 시대 이야기가 끼어들어 흐름이 끊긴다.","아직 2000년 의약 분업의 취지를 설명하는 중이므로 어울리지 않다.","(정답) ‘하지만 당시의 이유는 지금과는 좀 달랐다’ 앞에서 ‘조선 시대에도 이루어졌다’는 문장이 먼저 나와야 자연스럽게 연결된다.","이 위치에 넣으면 ‘당시의 이유는 달랐다’는 문장 없이 바로 조선 시대 설명으로 넘어가 어색하다."] },
      { num:40, content:{kind:"insert", given:"그런데 사실 이것은 코카콜라의 광고에서 처음 그려진 산타클로스의 모습이다.",
          text:"크리스마스를 생각하면 가장 먼저 떠오르는 것 중 하나가 아이들에게 선물을 전해주는 산타클로스이다. (㉠) 우리가 지금 떠올리는 산타클로스는 빨간 옷에 빨간 모자, 그리고 흰 수염이 덥수룩한 인상 좋은 할아버지이다. (㉡) 코카콜라 광고 이전에는 각 나라마다 산타클로스의 모습이 다 달랐다. (㉢) 그런데 코카콜라에서 겨울철 판매량을 늘리기 위해 산타클로스를 등장시킨 광고를 만들었다. (㉣) 그 광고 이후로 전 세계의 산타클로스가 광고 속의 모습으로 통일된 것이다."},
        options:["㉠","㉡","㉢","㉣"], correct:1,

          text:"미국, 중국, 러시아 등에서 한국으로 유학 온 학생들은 한국 뉴스를 보다가 깜짝 놀라는 경우가 있다고 한다. (㉠) 한국 뉴스의 끝 부분에 나오는 일기예보를 보다 보면, 전국적으로 비가 내릴 거라는 소식을 전하는 경우가 종종 있다. (㉡) 그런데 앞서 언급한 나라들에서는 전국적으로 비가 내리는 것이 대재앙이다. (㉢) 하지만 한국은 면적이 좁은 나라이기 때문에 전국에 비가 내린다고 해도 큰 문제가 되지 않는다. (㉣) 한국에서는 전국적인 비 소식이지만 그런 나라에서는 어느 한 지역에 비가 내린다는 소식 정도로 생각하면 되는 것이다."},

  { instruction:"※ [42~43] 다음을 읽고 물음에 답하십시오. (각 2점)",

  { instruction:"※ [44~45] 다음을 읽고 물음에 답하십시오. (각 2점)",

  { instruction:"※ [46~47] 다음을 읽고 물음에 답하십시오. (각 2점)",

    shared:{kind:"passage", text:"한국은 교육열이 높은 편이다. 이러한 교육열은 입시를 준비하는 학생들에게 과도한 스트레스를 줄 수 있다는 단점이 있기도 하지만 한국 경제를 발전시키는 원동력이 되기도 했다. 국가와 국민이 모두 (　　　　) 전체적으로 국민들의 지식 수준이 올라갔을 뿐만 아니라 우수한 인재들이 국가 경제 발전에 기여할 기회도 자연스럽게 더 많이 마련되었기 때문이다. 이러한 가운데 고등학교 수학 과목의 교육 과정이 점점 더 쉬워지고 있다고 한다. 교육부에서는 수학 교육 과정에서 학생들이 어려워하는 부분을 축소하거나 뺀 것에 대해서, 과학적 전문 지식을 갖춰야 하는 직업을 선택하지 않는 이상 굳이 어려운 수학 내용을 공부할 필요가 없다고 그 이유를 밝혔다. 그러나 교육 전문가들은 국민 전체의 수준이 높아지지 않으면 몇 사람의 노력과 실력만으로 국가가 보유하는 기술이 좋아지기 어렵다고 지적하고 있다. 한강의 기적이라 불릴 만큼 한국 경제가 발전한 것은 몇 명의 엘리트가 이끌어 온 게 아니라, 나라 전체에서 느낄 수 있는 뜨거운 교육열 덕분이었음을 꼭 기억해야 할 것이다."},

/* ---- MOCK: 도움 함수 ---- */
function mockAllQuestions(mock){ return mock.groups.flatMap(g=>g.questions.map(q=>({...q, group:g}))); }
function mockTotalCount(mock){ return mockAllQuestions(mock).length; }
const mockState = { mock:null, answers:{}, startTime:0, endTime:0, timerId:null, remainSec:0, finished:false, warned:[] };
let MOCKNOTE=null;   // tark etilgan imtihon tiklanganda ko'rsatiladigan xabar

/* Server ok/done qiymatlarini 100000 dan oshirmaydi (ortig'ini kesadi).
   Shuning uchun ball va vaqt bitta songa siqilmaydi: ok = ball (0~100),
   done = soniya (0~4200). Saralash bu yerda, brauzerda qilinadi.
   -v2: eski, buzuq natijalar aralashmasligi uchun reyting nomi yangilandi. */
function mockGame(mockId){ return GAME+'-mock-'+mockId+'-v2'; }
// Worker bitta ismga bitta qator saqlaydi. Shuning uchun har bir urinish
// alohida ism bilan yuboriladi: "Behruz", "Behruz (2)", "Behruz (3)"...
function mockAttemptName(n){ return n<=1 ? DB.current : DB.current+' ('+n+')'; }
function isMyMockRow(name){ return name===DB.current || name.indexOf(DB.current+' (')===0; }
function mockAttemptCount(mockId){
  const u=U(); if(!u || !u.mockAttempts2) return 0;
  return u.mockAttempts2[mockId]||0;
}
// server qaytargan qatorlarni tartiblash: avval ball (ko'p), keyin vaqt (kam)
function mockSortRows(rows, mock){
  const maxSec=mock?mock.durationSec:4200;
  return rows.filter(r=>typeof r.ok==='number' && r.ok>=0 && r.ok<=100 && r.done<=maxSec)
             .sort((a,b)=> b.ok-a.ok || a.done-b.done);
}
async function pushMockScore(mockId, score, seconds, attempt){
  try{
    await fetch(API+'/score',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({game:mockGame(mockId),name:mockAttemptName(attempt),
                           ok:Math.min(100,Math.max(0,Math.round(score))),
                           done:Math.min(99999,Math.max(0,Math.round(seconds)))})});
  }catch(e){ /* internet yo'q */ }
}

/* ---- MOCK: tark etilgan imtihonni tiklash ----
   Har bir javob localStorage'ga yozib boriladi. O'quvchi sahifani yopib
   ketsa, keyingi kirishda o'sha javoblari bo'yicha baholanib reytingga
   yuboriladi. Qayta ishlamoqchi bo'lsa boshidan boshlaydi. */
function mockSavePending(){
  const u=U(); if(!u) return;
  u.mockPending={ mockId:mockState.mock.id, answers:mockState.answers,
                  endTime:mockState.endTime, durationSec:mockState.mock.durationSec };
  save();
}
function mockClearPending(){
  const u=U(); if(!u) return;
  u.mockPending=null; save();
}
function mockScoreOf(mock, answers){
  let score=0;
  mockAllQuestions(mock).forEach(q=>{ if(answers[q.num]===q.correct) score+=2; });
  return score;
}
function mockNextAttempt(mockId){
  const u=U(); if(!u) return 1;
  if(!u.mockAttempts2) u.mockAttempts2={};
  const n=(u.mockAttempts2[mockId]||0)+1;
  u.mockAttempts2[mockId]=n; save();
  return n;
}
// ilova ochilganda chaqiriladi
async function mockRecoverPending(){
  const u=U(); if(!u || !u.mockPending) return;
  const p=u.mockPending;
  const m=MOCKS.find(x=>x.id===p.mockId);
  const answered=m?Object.keys(p.answers||{}).length:0;
  if(!m || !answered){ mockClearPending(); return; }   // bitta ham javob yo'q — hisobga olinmaydi
  const score=mockScoreOf(m, p.answers);
  const seconds=Math.min(p.durationSec, Math.max(0, Math.round(p.durationSec-(p.endTime-Date.now())/1000)));
  const n=mockNextAttempt(m.id);
  mockClearPending();
  MOCKNOTE=`지난번 <b>${m.label}</b> 시험이 끝까지 진행되지 않아, 그때까지 선택한 답안(${answered}문항)으로 채점되었습니다. — <b>${score} / 100</b> (${n}회차)`;
  delete TOPS[mockGame(m.id)]; delete TOPERR[mockGame(m.id)];
  await pushMockScore(m.id, score, seconds, n);
}
// Xabar o'quvchi o'zi yopmaguncha turadi (ekran qayta chizilsa ham yo'qolmaydi)
function mockNoteCard(){
  if(!MOCKNOTE) return '';
  return `<div class="mocknote"><div>${MOCKNOTE}</div>
    <button class="btn ghost" id="notex" style="margin-top:10px">확인</button></div>`;
}
function wireMockNote(redraw){
  const b=document.getElementById('notex');
  if(b) b.onclick=()=>{ MOCKNOTE=null; redraw(); };
}
function mockRankCard(mockId, title){
  const game=mockGame(mockId);
  const rows=TOPS[game], err=TOPERR[game];
  let body;
  if(rows===undefined && !err) body='<p class="hint">불러오는 중...</p>';
  else if(err) body='<p class="hint">순위를 불러올 수 없습니다. 인터넷 연결을 확인하세요.</p>';
  else {
    const list=mockSortRows(rows, MOCKS.find(x=>x.id===mockId));
    if(!list.length) body='<p class="hint">아직 응시자가 없습니다. 첫 번째가 되어 보세요.</p>';
    else body=`<table class="rank">
        <tr><th>#</th><th>이름</th><th class="num">점수</th><th class="num">시간</th></tr>
        ${list.map((r,i)=>`<tr class="${isMyMockRow(r.name)?'me':''}">
          <td>${i+1}</td><td>${r.name}</td><td class="num">${r.ok} / 100</td><td class="num">${mockFmtTime(r.done)}</td></tr>`).join('')}
      </table>`;
  }
  const n=mockAttemptCount(mockId);
  return `
    <div class="card">
      <h2>${title}</h2>
      <p class="hint">점수가 높고 시간이 빠른 순으로 표시됩니다. 응시할 때마다 이름 뒤에 회차가 표시됩니다.</p>
      ${n>1?`<p class="hint" style="color:var(--accent);font-weight:600">회원님은 이 시험을 ${n}번 응시했습니다.</p>`:''}
      ${body}
      <button class="btn ghost" id="reload">새로고침</button>
    </div>`;
}

function startMock(mockId){
  const m=MOCKS.find(x=>x.id===mockId);
  mockState.mock=m; mockState.answers={}; mockState.finished=false; mockState.warned=[];
  mockState.startTime=Date.now();
  mockState.endTime=mockState.startTime+m.durationSec*1000;
  mockState.remainSec=m.durationSec;
  if(mockState.timerId) clearInterval(mockState.timerId);
  mockState.timerId=setInterval(mockTick, 1000);
  mockSavePending();
  renderMockExam();
}
/* vaqt ogohlantirishlari */
const MOCKWARN=[{s:600,txt:'⏰ 10분 남았습니다'},{s:300,txt:'⏰ 5분 남았습니다'},{s:60,txt:'⏰ 1분 남았습니다',urgent:true}];
function mockToast(txt, urgent){
  let el=document.getElementById('mocktoast');
  if(!el){ el=document.createElement('div'); el.id='mocktoast'; document.body.appendChild(el); }
  el.className='mocktoast'+(urgent?' urgent':'');
  el.textContent=txt;
  void el.offsetWidth;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t=setTimeout(()=>el.classList.remove('show'), 4000);
}
function mockCheckWarn(){
  MOCKWARN.forEach(w=>{
    if(mockState.remainSec<=w.s && mockState.remainSec>0 && mockState.warned.indexOf(w.s)<0){
      mockState.warned.push(w.s);
      mockToast(w.txt, w.urgent);
    }
  });
}
// vaqt haqiqiy soatdan hisoblanadi: telefon fon rejimiga o'tsa ham timer to'g'ri qoladi
function mockTick(){
  if(mockState.finished) return;
  mockState.remainSec=Math.round((mockState.endTime-Date.now())/1000);
  const tEl=document.getElementById('mocktime');
  if(tEl){
    tEl.textContent=mockFmtTime(mockState.remainSec);
    tEl.parentElement.classList.toggle('low', mockState.remainSec<=300);
  }
  mockCheckWarn();
  if(mockState.remainSec<=0){ clearInterval(mockState.timerId); finishMock(); }
}
// boshqa ilovadan qaytganda vaqtni darhol yangilash
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && mockState.mock && !mockState.finished && mockState.timerId) mockTick();
});
function mockFmtTime(s){ s=Math.max(0,s); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function renderMockExam(){
  const m=mockState.mock;
  const total=mockTotalCount(m);

function renderMockGroup(g, review){
  return `<div class="qcard mockgroup"><p class="ins">${g.instruction}</p>
    ${g.shared?renderMockContent(g.shared):''}
    ${g.questions.map(q=>review?renderMockReview(q,!!g.shared):renderMockQuestion(q,!!g.shared)).join('')}

}
function mockOptText(o){ return Array.isArray(o)?'('+o.join(') → (')+')':o; }
// savol raqami + savol matni (bo'sh sarlavha bo'lsa raqam matn bilan bir qatorda turadi)
function mockHead(q, sharedAbove){
  const inline = !q.prompt && !sharedAbove && q.content && q.content.kind==='plain';
  return `<div class="qtext"><span class="qnum">${q.num}</span>${q.prompt||(inline?q.content.text:'')}</div>`;
}
function mockBody(q, sharedAbove){
  if(sharedAbove || !q.content) return '';
  if(!q.prompt && q.content.kind==='plain') return '';
  return renderMockContent(q.content);
}
function renderMockQuestion(q, sharedAbove){
  const picked=mockState.answers[q.num];
  return `
    <div class="mockq">
      ${mockHead(q, sharedAbove)}
      ${mockBody(q, sharedAbove)}
      <div class="opts" style="margin-top:14px">
        ${q.options.map((o,oi)=>`<button class="opt${picked===oi?' picked':''}" data-q="${q.num}" data-o="${oi}">${oi+1}) ${mockOptText(o)}</button>`).join('')}
      </div>
    </div>`;
}
function renderMockContent(c){
  if(c.kind==='plain') return `<div class="qtext" style="margin-top:6px">${c.text}</div>`;
  if(c.kind==='passage') return `<div class="passage">${c.text}</div>`;
  if(c.kind==='ad') return `<div class="adbox"><div class="t1">${c.t1}</div><div class="t2">${c.t2}</div></div>`;
  if(c.kind==='poster') return `<div class="posterbox"><h4>${c.title}</h4><div class="pl">${c.lines.map(l=>'• '+l).join('<br>')}</div>${c.note?`<div class="note">${c.note}</div>`:''}</div>`;
  if(c.kind==='headline') return `<div class="headlinebox">${c.text}</div>`;
  if(c.kind==='chart'){
    const max=Math.max(...c.bars.map(b=>b.value));
    return `<div class="chartbox"><h4>${c.title}</h4><div class="unit">${c.unit}</div>
      <div class="chartbars">${c.bars.map(b=>`<div class="b" style="height:${b.value/max*100}%"><span>${b.value}</span></div>`).join('')}</div>
      <div class="chartlabels">${c.bars.map(b=>`<div>${b.label}</div>`).join('')}</div></div>`;
  }
  if(c.kind==='order'){
    return `<div class="orderlist">${Object.keys(c.sentences).map(k=>`<div>(${k}) ${c.sentences[k]}</div>`).join('')}</div>`;
  }
  if(c.kind==='insert'){
    const marked=c.text.replace(/\(?([㉠㉡㉢㉣])\)?/g,'<span class="insmark">$1</span>');
    return `<div class="insgiven">${c.given}</div><div class="passage">${marked}</div>`;
  }
  return '';
}

  if(mockState.timerId) clearInterval(mockState.timerId);
  const m=mockState.mock;

function renderMockReview(q, sharedAbove){
  const picked=mockState.answers[q.num];

  return `<div class="mockq">
    ${mockHead(q, sharedAbove)}

    </div>
    <div class="rev ${ok?'ok':'no'}">
      <p class="hint">${picked===undefined?'답을 선택하지 않았습니다.':(ok?'정답입니다.':'오답입니다.')} (정답: ${q.correct+1}번)</p>
      ${q.explain.map((e,oi)=>`<p class="a"><b>${oi+1})</b> ${e}</p>`).join('')}
    </div>
  </div>`;
}

/* ---- start ---- */
load();
if(DB.current && DB.users[DB.current]){
  screenTypes();
  // tark etilgan imtihon bo'lsa: o'sha javoblar bo'yicha baholanib reytingga yuboriladi
  mockRecoverPending().then(()=>{ if(MOCKNOTE) screenTypes(); });
} else screenName();
</script>
