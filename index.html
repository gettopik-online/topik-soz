<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GETTOPIK online — O'rta daraja so'zlari</title>
<style>
  :root{
    --bg:#EEF1F6; --card:#FFFFFF; --ink:#0E1320; --muted:#5B6478;
    --line:#D8DEE9; --accent:#067DF4; --ok:#127A4B; --no:#E91F3D; --red:#E91F3D;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    font-size:17px; line-height:1.7; display:flex; justify-content:center;
    padding:24px 16px 56px;
  }
  .wrap{width:100%;max-width:720px}
  header{margin-bottom:18px}
  .top{display:flex;align-items:center;gap:14px}
  .logo{background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px 9px;line-height:0;flex:none}
  .logo img{height:42px;width:auto;display:block}
  .brand{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600}
  h1 .accent{color:var(--red)}
  h1{font-size:30px;line-height:1.25;margin-top:6px;letter-spacing:-.02em}
  .lead{color:var(--muted);margin-top:8px}
  .who{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:15px;color:var(--muted)}
  .who b{color:var(--ink)}
  .link{background:none;border:0;color:var(--accent);font:inherit;font-size:15px;cursor:pointer;padding:0;text-decoration:underline}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px;margin-bottom:16px}
  h2{font-size:20px;margin-bottom:14px;letter-spacing:-.01em}
  .hint{color:var(--muted);font-size:15px}

  .sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
  .set{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:border-color .15s,transform .15s}
  @media (hover:hover){ .set:hover{border-color:var(--accent);transform:translateY(-2px)} }
  .set .n{font-size:22px;font-weight:700}
  .set .m{color:var(--muted);font-size:14px}

  .rounds{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;margin-top:6px}
  .round{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 10px;cursor:pointer;font:inherit;color:inherit;text-align:center}
  @media (hover:hover){ .round:hover{border-color:var(--accent)} }
  .round.done{border-color:var(--ok);color:var(--ok)}
  .round b{display:block;font-size:17px}
  .round span{font-size:13px;color:var(--muted)}

  .bar{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
  .step{font-size:14px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--card)}
  .step.on{border-color:var(--accent);color:var(--accent);font-weight:600}
  .prog{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:22px}
  .prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}

  .ko{font-size:44px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
  .uz{font-size:22px;margin-top:10px}
  .big-uz{font-size:32px;font-weight:600;line-height:1.4}

  .opts{display:grid;gap:12px;margin-top:20px}
  .opt{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:16px 18px;text-align:left;font:inherit;color:inherit;cursor:pointer}
  @media (hover:hover){ .opt:hover{border-color:var(--accent)} }
  .opt.ok{border-color:var(--ok);color:var(--ok);font-weight:600}
  .opt.no{border-color:var(--no);color:var(--no)}
  .opt:disabled{cursor:default}

  input[type=text]{width:100%;font:inherit;font-size:28px;padding:14px 16px;margin-top:16px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink)}
  input.name{font-size:20px}
  input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  input.ok{border-color:var(--ok)} input.no{border-color:var(--no)}

  .btn{background:var(--accent);color:#fff;border:0;border-radius:11px;padding:14px 24px;font:inherit;font-weight:600;cursor:pointer;margin-top:16px}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .btn:disabled{opacity:.45;cursor:default}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

  .fb{margin-top:16px;font-size:17px}
  .fb.ok{color:var(--ok)} .fb.no{color:var(--no)}

  .list{margin-top:8px}
  .list div{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line)}
  .list div:last-child{border-bottom:0}
  .list .k{font-weight:600}
  .list .v{color:var(--muted);text-align:right}

  .rank{width:100%;border-collapse:collapse;margin-top:6px}
  .rank td,.rank th{padding:10px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:16px}
  .rank th{font-size:14px;color:var(--muted);font-weight:600}
  .rank td.num{text-align:right;white-space:nowrap}
  .rank tr.me td{font-weight:700;color:var(--accent)}

  .score{font-size:40px;font-weight:700}
  .warn{background:#FFF6E5;border:1px solid #F0D9A8;color:#6B4E00;border-radius:11px;padding:12px 14px;font-size:14px;margin-bottom:16px}
  footer{color:var(--muted);font-size:14px;text-align:center;margin-top:26px}
  @media (max-width:520px){ .ko{font-size:34px} .big-uz{font-size:26px} h1{font-size:24px} }

  /* ============ MOCK 시험 ============ */
  .mockbar{position:sticky;top:0;z-index:20;background:var(--card);border:1px solid var(--line);border-radius:11px;
    padding:10px 16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .mockbar .t{font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
  .mockbar.low .t{color:var(--no)}
  .qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:14px}
  .qnum{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;background:var(--ink);
    color:#fff;border-radius:8px;font-weight:800;font-size:15px;margin-right:8px;flex:none}
  .qtext{font-size:17px;line-height:1.7}
  .passage{background:#F7F9FC;border:1px solid var(--line);border-radius:11px;padding:18px 20px;margin:12px 0;font-size:16px;line-height:1.85}
  .passage u{text-decoration:underline;text-decoration-thickness:2px}
  .adbox{border-radius:12px;padding:26px 20px;margin:12px 0;text-align:center;color:#fff;
    background:linear-gradient(135deg,#1B2A6B,#3457D5);box-shadow:0 6px 18px rgba(27,42,107,.25)}
  .adbox .t1{font-size:19px;font-weight:800;line-height:1.45}
  .adbox .t2{font-size:14px;margin-top:10px;opacity:.85}
  .posterbox{border:2px solid var(--ink);border-radius:10px;padding:18px 22px;margin:12px 0}
  .posterbox h4{text-align:center;font-size:16px;margin-bottom:12px;letter-spacing:-.01em}
  .posterbox .pl{font-size:15px;line-height:2;padding-left:4px}
  .posterbox .note{margin-top:10px;font-size:13.5px;color:var(--muted)}
  .headlinebox{border:2px solid var(--ink);border-radius:10px;padding:18px;margin:12px 0;text-align:center;font-weight:800;font-size:17px}
  .chartbox{border:1px solid var(--line);border-radius:11px;padding:20px 18px 12px;margin:12px 0}
  .chartbox h4{text-align:center;font-size:15px;margin-bottom:16px;font-weight:700}
  .chartbox .unit{text-align:right;font-size:12px;color:var(--muted);margin-bottom:4px}
  .chartbars{display:flex;align-items:flex-end;gap:8px;height:170px;padding:0 4px}
  .chartbars .b{flex:1;background:#35C3F3;border-radius:4px 4px 0 0;position:relative;min-height:2px}
  .chartbars .b span{position:absolute;left:50%;top:-22px;transform:translateX(-50%);font-size:12.5px;font-weight:700;white-space:nowrap}
  .chartlabels{display:flex;gap:8px;padding:0 4px;margin-top:8px}
  .chartlabels div{flex:1;text-align:center;font-size:12.5px;color:var(--muted)}
  .orderlist div{background:#F7F9FC;border:1px solid var(--line);border-radius:9px;padding:11px 14px;margin-bottom:7px;font-size:15px}
  /* ==== 50 so'z testi ==== */
  .wtbar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:14px 0 4px}
  .wtbar i{display:block;height:100%;background:var(--accent);transition:width .2s linear}
  .wtbar.low i{background:var(--no)}
  .wtword{font-size:30px;font-weight:800;text-align:center;margin:22px 0 6px;line-height:1.35}
  .wtsub{text-align:center;color:var(--muted);font-size:15px;margin-bottom:6px}
  .wtcount{display:flex;justify-content:space-between;font-size:15px;color:var(--muted)}
  .wtinput{width:100%;font:inherit;font-size:22px;text-align:center;padding:14px;border:1px solid var(--line);
    border-radius:11px;background:var(--card);color:inherit;margin-top:14px}
  .wtinput:focus{outline:none;border-color:var(--accent)}
  .wtlock{background:#FFF7E6;border:1px solid #F0C36D;border-radius:11px;padding:18px;text-align:center}
  .wtrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .noticebox{border:1px solid var(--line);border-radius:11px;padding:18px 20px;margin:12px 0;background:#F7F9FC}
  .noticebox h4{text-align:center;font-size:15.5px;margin-bottom:10px;letter-spacing:-.01em}
  .noticebox .nline{font-size:15px;line-height:1.85}
  .ntable{width:100%;border-collapse:collapse;margin:10px 0;font-size:14.5px}
  .ntable th,.ntable td{border:1px solid var(--line);padding:7px 9px;text-align:center}
  .ntable th{background:#EAF0F8;font-weight:700}
  .noticebox .nfoot{font-size:13px;color:var(--muted);margin-top:6px}
  .qimg{margin:12px 0;text-align:center}
  .qimg img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:10px}
  .scriptbox{background:#FFF7E6;border:1px solid #F0C36D;border-radius:11px;padding:16px 18px;margin:12px 0;font-size:15.5px;line-height:1.9}
  .scriptbox .who{font-weight:700;margin-right:6px}
  .listenbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
  .listenbar .dot{width:11px;height:11px;border-radius:50%;background:var(--no);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .piewrap{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:center}
  .pielegend{display:grid;gap:7px;font-size:14px}
  .pielegend div{display:flex;align-items:center;gap:8px;white-space:nowrap}
  .pielegend i{width:13px;height:13px;border-radius:3px;flex:none}
  .chartbox .src{text-align:right;font-size:12px;color:var(--muted);margin-top:10px}
  .insmark{display:inline-flex;align-items:center;justify-content:center;width:23px;height:23px;border:1.5px solid var(--accent);
    border-radius:50%;color:var(--accent);font-size:12.5px;font-weight:800;margin:0 1px;vertical-align:middle}
  .insgiven{background:#EAF3FF;border:1px solid var(--accent);border-radius:10px;padding:13px 16px;margin-bottom:12px;font-weight:600;font-size:15.5px}
  .rev{border-top:3px solid var(--line);margin-top:10px;padding-top:14px}
  .rev.ok{border-color:var(--ok)} .rev.no{border-color:var(--no)}
  .rev .a{font-size:14.5px;margin-top:6px}
  .rev .a b{font-weight:700}
  .opt.picked{border-color:var(--accent);border-width:2px;font-weight:600}
  .mocktoast{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-140%);z-index:60;
    background:var(--ink);color:#fff;border-radius:12px;padding:14px 22px;font-weight:700;font-size:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);transition:transform .35s ease;pointer-events:none;max-width:92vw;text-align:center}
  .mocktoast.show{transform:translateX(-50%) translateY(0)}
  .mocktoast.urgent{background:var(--no)}
  .mocknote{background:#FFF7E6;border:1px solid #F0C36D;border-radius:11px;padding:14px 16px;margin-bottom:14px;font-size:15px}
  .mockgroup .ins{font-weight:700;color:var(--ink);margin-bottom:4px}
  .mockq + .mockq{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}

  /* ============ 쓰기 (51/52/53/54) ============ */
  .ss-passage{background:#F7F9FC;border:1px solid var(--line);border-radius:11px;padding:16px 18px;font-size:16px;line-height:1.9;white-space:pre-line;margin-bottom:6px}
  .ss-passage b{color:var(--accent)}
  .ss-steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .ss-steps span{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--card)}
  .ss-steps span.on{border-color:var(--accent);color:var(--accent);font-weight:700}
  .ss-steps span.done{border-color:var(--ok);color:var(--ok)}
  label.ss-f{display:block;font-weight:700;margin:14px 0 6px;font-size:15px}
  .ss-card input[type=text],.ss-card select{font-size:16px;padding:12px 14px;margin-top:0}
  .ss-card textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;margin-top:0;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);resize:vertical;min-height:96px}
  .ss-card select{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  .ss-card input[type=text]:disabled,.ss-card select:disabled,.ss-card textarea:disabled{background:#F3F5F9;color:var(--muted)}
  .ss-fb{background:#F0F8FF;border:1px solid #BEE0FF;border-radius:11px;padding:14px 16px;margin-top:10px;font-size:14.5px}
  .ss-fb b.model{color:var(--ok);font-size:16px}
  .ss-fb .alt{margin-top:6px;color:var(--ink)}
  .ss-fb .hint2{margin-top:6px;color:var(--muted)}
  .ss-qa-item{border-top:1px solid var(--line);padding:14px 0}
  .ss-qa-item:first-child{border-top:0;padding-top:0}
  .ss-correct{color:var(--ok);font-weight:700;font-size:14px;margin-top:8px}
  .ss-vocab-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 20px;margin-bottom:2px}
  @media (max-width:480px){.ss-vocab-grid{grid-template-columns:1fr}}
  .ss-vocab-grid div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
  .ss-vocab-grid b{font-weight:700}
  .ss-vocab-grid span{color:var(--muted)}
  .ss-chart-wrap{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:14px;align-items:flex-start}
  .ss-pie{width:150px;height:150px;border-radius:50%;flex:none}
  .ss-pie-legend div{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0}
  .ss-pie-legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
  .ss-bars{display:flex;align-items:flex-end;gap:26px;height:150px}
  .ss-bar-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
  .ss-bar-col .bv{background:var(--accent);width:52px;border-radius:6px 6px 0 0}
  .ss-bar-col .bl{font-size:13px;color:var(--muted);margin-top:6px}
  .ss-bar-col .bn{font-size:13px;font-weight:700;margin-bottom:4px}
  .ss-cause{background:#F7F9FC;border:1px solid var(--line);border-radius:11px;padding:12px 16px;font-size:14.5px;margin-bottom:6px}
  .ss-cause b{display:block;margin-bottom:4px}
  .ss-counter{font-size:13px;color:var(--muted);margin-top:8px;text-align:right}
  .ss-counter.warn{color:var(--no)}
  .ss-manu{display:inline-block;border:1px solid var(--ink);margin-top:10px;max-width:100%;overflow-x:auto}
  .ss-manu-row{display:flex}
  .ss-manu-cell{width:26px;height:30px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
  .ss-manu-num{width:34px;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line)}
  @media (max-width:520px){ .ss-manu-cell{width:20px;height:24px;font-size:12px} .ss-manu-num{width:28px;font-size:10px} }
  .ss-savedmsg{background:#EAF7EE;border:1px solid var(--ok);color:var(--ok);border-radius:11px;padding:14px 16px;font-weight:700;margin-top:14px}

  #ssPrintRoot{position:absolute;top:-10000px;left:0;width:780px;background:#fff;color:#111}
  #ssPrintRoot .pp{padding:26px 30px}
  #ssPrintRoot h2{font-size:16px;border-bottom:2px solid #111;padding-bottom:6px;margin:18px 0 10px}
  #ssPrintRoot h2:first-of-type{margin-top:0}
  #ssPrintRoot .qa{margin:0 0 10px;font-size:12px;line-height:1.6}
  #ssPrintRoot .qa .g{color:#555}
  #ssPrintRoot .qa .c{color:#127A4B;font-weight:700}
  #ssPrintRoot .blk b{display:block;font-size:12.5px;margin:10px 0 6px}
  #ssPrintRoot .ss-manu-cell{width:22px;height:24px;font-size:12px}
  #ssPrintRoot .ss-manu-num{width:30px;font-size:9px}
</style>
</head>
<body>
<div class="wrap">

<script>
/* ============ bo'limlar (43~44 va 46~47) ============ */
// SECTIONS data2.js dan keladi. Har set'ga secId qo'shamiz, global SETS = hamma set.
SECTIONS.forEach(sec=>sec.sets.forEach(s=>{ s.secId=sec.id; s.uid=sec.id+'-'+s.id; }));
const ALLSETS = SECTIONS.flatMap(s=>s.sets);
// sarlavhadagi so'z soni qo'lda emas, avtomatik hisoblanadi
(function(){
  const n=ALLSETS.reduce((a,s)=>a+s.words.length,0);
  const el=document.getElementById('lead');
  if(el) el.textContent=n+" ta so'z — "+el.textContent;
})();
const TYPES = [
  {id:'listen', label:'듣기', uz:'Tinglash'},
  {id:'read',   label:'읽기', uz:"O'qish"},
];
let TYPE = null;                          // joriy tur (listen/read)
let SEC  = null;                          // joriy bo'lim
function typeSections(t){ return SECTIONS.filter(s=>s.type===t && !s.hidden); }
function mockWordSection(round){ return SECTIONS.find(s=>s.mockRound===round); }
function typeLabel(t){ const x=TYPES.find(y=>y.id===t); return x.label+' · '+x.uz; }
function curSets(){ return SECTIONS.find(x=>x.id===SEC).sets; }
function secLabel(id){ return SECTIONS.find(x=>x.id===id).label; }
function secType(id){ return SECTIONS.find(x=>x.id===id).type; }
function setsOfType(t){ return typeSections(t).flatMap(s=>s.sets); }

/* ============ server (umumiy reyting) ============ */
const API='https://gogeup-soz-reyting.online-koreys-tili.workers.dev';
const GAME='topik-soz-v4';   // so'zlar almashgani uchun reyting noldan
const TOPS={}, TOPERR={};              // reyting keshi: game nomi -> qatorlar

// reyting nomlari: umumiy / tur / bo'lim
function gTotal(){ return GAME; }
function gType(t){ return GAME+'-'+t; }
function gSec(id){ return GAME+'-s-'+id; }

async function post(game, ok, done){
  try{
    await fetch(API+'/score',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({game,name:DB.current,ok,done})});
  }catch(e){ /* internet yo'q — natija telefonda saqlanib turaveradi */ }
}
async function pushScore(){
  const t=userScore(DB.current);
  const jobs=[ post(gTotal(), t.ok, t.done) ];
  TYPES.forEach(x=>{ const s=userScore(DB.current,{type:x.id}); jobs.push(post(gType(x.id), s.ok, s.done)); });
  SECTIONS.forEach(sec=>{ const s=userScore(DB.current,{sec:sec.id}); jobs.push(post(gSec(sec.id), s.ok, s.done)); });
  await Promise.all(jobs);
}
async function fetchTop(game){
  try{
    const r=await fetch(API+'/top?game='+game);
    const d=await r.json(); TOPS[game]=d.rows||[]; TOPERR[game]=false;
  }catch(e){ TOPS[game]=null; TOPERR[game]=true; }
}

/* ============ saqlash ============ */
const KEY='gettopik_soz_v4';   // v2 — so'zlar almashgani uchun eski natijalar tozalanadi
let DB={users:{},current:null};
let SAVE_OK=true;

function load(){
  try{ const r=localStorage.getItem(KEY); if(r) DB=JSON.parse(r); }
  catch(e){ SAVE_OK=false; }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch(e){ SAVE_OK=false; }
}
function blankUser(){
  const st={}; ALLSETS.forEach(s=>st[s.uid]={});
  return {stats:st, done:{}, last:null};
}
function U(){
  if(!DB.current) return null;
  let u=DB.users[DB.current];
  if(!u){ u=DB.users[DB.current]=blankUser(); }
  ALLSETS.forEach(s=>{
    let a=u.stats[s.uid];
    if(!a){ u.stats[s.uid]={}; return; }
    if(Array.isArray(a)){                      // eski format (indeks bo'yicha) -> so'z bo'yicha
      const o={}; a.forEach((v,i)=>{ if(v!==null && s.words[i]) o[s.words[i][0]]=v; });
      u.stats[s.uid]=o;
    }
  });
  if(!u.done) u.done={};
  if(!u.tests) u.tests={};
  return u;
}

/* ============ yordamchi ============ */
const app=document.getElementById('app');
const whoEl=document.getElementById('who');
const state={set:null, round:null, mode:'round', list:[], i:0, correct:0, wrong:[], miss:{}};

function chunk(arr,n){
  const r=[]; for(let i=0;i<arr.length;i+=n) r.push(arr.slice(i,i+n));
  if(r.length>1 && r[r.length-1].length<=4){ const t=r.pop(); r[r.length-1]=r[r.length-1].concat(t); }
  return r;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function rounds(set){ return chunk(set.words.map(w=>({ko:w[0],uz:w[1],uid:set.uid})),10); }
function norm(s){return s.replace(/\s+/g,'').trim();}
function accepted(ko){ const v=[ko, ko.replace(/\([^)]*\)/g,''), ko.replace(/[()]/g,'')]; return [...new Set(v.map(norm).filter(Boolean))]; }
function setByUid(uid){ return ALLSETS.find(s=>s.uid===uid); }
function setById(id){ return curSets().find(s=>s.id===id); }   // joriy bo'lim ichida
// stat: har so'z koreyscha kaliti bo'yicha saqlanadi -> yangi so'z qo'shilsa eski natija saqlanadi
function setStat(s){
  const a=U().stats[s.uid]; let ok=0,no=0,done=0;
  s.words.forEach(w=>{ const v=a[w[0]]; if(v===true){ok++;done++;} else if(v===false){no++;done++;} });
  return {ok,no,done,all:s.words.length};
}
function secStat(){ let ok=0,no=0,done=0,all=0; curSets().forEach(s=>{const t=setStat(s);ok+=t.ok;no+=t.no;done+=t.done;all+=t.all;}); return {ok,no,done,all}; }
function totalStat(){ let ok=0,no=0,done=0,all=0; ALLSETS.forEach(s=>{const t=setStat(s);ok+=t.ok;no+=t.no;done+=t.done;all+=t.all;}); return {ok,no,done,all}; }
function wrongOf(s){
  const a=U().stats[s.uid], out=[];
  s.words.forEach(w=>{ if(a[w[0]]===false) out.push({ko:w[0],uz:w[1],uid:s.uid}); });
  return out;
}
function secWrong(){ return curSets().flatMap(s=>wrongOf(s)); }
function userScore(name, filt){
  const u=DB.users[name]; if(!u) return {ok:0,done:0,all:0};
  let list=ALLSETS;
  if(filt && filt.type) list=setsOfType(filt.type);
  if(filt && filt.sec)  list=SECTIONS.find(x=>x.id===filt.sec).sets;
  let ok=0,done=0,all=0;
  list.forEach(s=>{ all+=s.words.length; const a=u.stats[s.uid]; if(!a||Array.isArray(a)) return;
    s.words.forEach(w=>{ const v=a[w[0]]; if(v!==undefined&&v!==null){done++; if(v===true) ok++;} }); });
  return {ok,done,all};
}
// tur bo'yicha statistika
function typeStat(t){ let ok=0,no=0,done=0,all=0; setsOfType(t).forEach(s=>{const x=setStat(s);ok+=x.ok;no+=x.no;done+=x.done;all+=x.all;}); return {ok,no,done,all}; }
function typeWrong(t){ return setsOfType(t).flatMap(s=>wrongOf(s)); }

/* ============ ism ============ */
function screenName(){
  whoEl.innerHTML='';
  app.innerHTML=`
    ${SAVE_OK?'':'<div class="warn">Bu brauzerda natija saqlanmaydi. Saytni oddiy oynada oching (yashirin rejim emas).</div>'}
    <div class="card">
      <h2>Ismingizni yozing</h2>
      <p class="hint">Natijangiz shu ism ostida saqlanadi. Keyingi safar shu ismni tanlab davom etasiz.</p>
      <input type="text" class="name" id="nm" maxlength="24" placeholder="Ism Familiya" autocomplete="off">
      <div class="row"><button class="btn" id="go">Boshlash</button></div>
    </div>
    ${Object.keys(DB.users).length?`
    <div class="card">
      <h2>Avvalgi ismlar</h2>
      <div class="row">
        ${Object.keys(DB.users).map(n=>`<button class="btn ghost" data-n="${n}">${n}</button>`).join('')}
      </div>
    </div>`:''}`;
  const nm=document.getElementById('nm'); nm.focus();
  const go=()=>{
    const v=nm.value.trim(); if(!v) {nm.focus(); return;}
    DB.current=v; if(!DB.users[v]) DB.users[v]=blankUser(); save(); screenTypes();
  };
  document.getElementById('go').onclick=go;
  nm.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{DB.current=b.dataset.n;save();screenTypes();});
}
function whoBar(level){   // level: 0=tur tanlash, 1=bo'limlar, 2=variantlar/ichkari
  whoEl.innerHTML=`<span>O'quvchi: <b>${DB.current}</b></span>
    ${level>=1?`<button class="link" id="navtype">듣기 / 읽기</button>`:''}
    ${level>=2?`<button class="link" id="navsec">${typeLabel(TYPE).split(' · ')[0]} bo'limlari</button>`:''}
    <button class="link" id="chg">ismni almashtirish</button>`;
  document.getElementById('chg').onclick=()=>{DB.current=null;save();screenName();};
  const tt=document.getElementById('navtype'); if(tt) tt.onclick=screenTypes;
  const ts=document.getElementById('navsec'); if(ts) ts.onclick=screenSections;
}

/* ============ 1-ekran: 듣기 / 읽기 ============ */
function screenTypes(){
  whoBar(0);
  const t=totalStat();

function rankCard(game, title, total){
  const rows=TOPS[game], err=TOPERR[game];
  let body;
  if(rows===undefined && !err) body='<p class="hint">Yuklanmoqda...</p>';
  else if(err) body='<p class="hint">Reytingni yuklab bo\'lmadi. Internetni tekshiring.</p>';
  else if(!rows || !rows.length) body='<p class="hint">Hali hech kim natija yubormagan. Birinchi bo\'ling.</p>';
  else body=`<table class="rank">
        <tr><th>#</th><th>Ism</th><th class="num">To'g'ri</th><th class="num">Ishlangan</th></tr>
        ${rows.map((r,i)=>`<tr class="${r.name===DB.current?'me':''}">
          <td>${i+1}</td><td>${r.name}</td><td class="num">${r.ok}</td><td class="num">${r.done} / ${total}</td></tr>`).join('')}
      </table>`;
  return `
    <div class="card">
      <h2>${title}</h2>
      <p class="hint">Raund tugagach natijangiz avtomatik yuboriladi.</p>
      ${body}
      <button class="btn ghost" id="reload" data-g="${game}">Yangilash</button>
    </div>`;
}
// reytingni kerak bo'lganda yuklash + Yangilash tugmasi
function wireRank(game, redraw){
  if(TOPS[game]===undefined && !TOPERR[game]) fetchTop(game).then(()=>{ if(document.getElementById('reload')) redraw(); });
  const rl=document.getElementById('reload');
  if(rl) rl.onclick=async()=>{ delete TOPS[game]; delete TOPERR[game]; redraw(); await fetchTop(game); redraw(); };
}

      body:JSON.stringify({game:quizGame(set.uid),name:DB.current,

function wireSetTestAudio(){
  const au=document.getElementById('qaudio'); if(!au) return;
  const markCanAnswer=()=>{
    if(setTest.canAnswer) return; setTest.canAnswer=true;
    app.querySelectorAll('.answerhint').forEach(h=>h.remove());
    app.querySelectorAll('.opt[data-tq]').forEach(b=>{
      if(setTest.answers[+b.dataset.tq]===undefined) b.disabled=false;
    });
    wireSetTestOptions();
  };
  const markEnded=()=>{
    if(setTest.audioEnded) return; setTest.audioEnded=true;
    const row=document.getElementById('textrow'); if(!row) return;
    row.innerHTML='<button class="btn ghost" id="showtext">Matnni ko\'rish</button>';
    document.getElementById('showtext').onclick=toggleTestScript;
  };
  au.onended=markEnded;
  au.ontimeupdate=()=>{
    if(!au.duration) return;
    if(au.currentTime>=au.duration-10) markCanAnswer();
    if(au.currentTime>=au.duration-0.35) markEnded();
  };
  au.onpause=()=>{ if(au.duration && au.currentTime>=au.duration-0.35) markEnded(); };

  setTest.textShown=!setTest.textShown;
  const box=document.getElementById('scriptbox');
  box.innerHTML=setTest.textShown
    ? `<div class="list" style="margin-top:14px">${setTest.t.script.map(([who,line])=>`<div><span class="k">${who}</span><span class="v">${line}</span></div>`).join('')}</div>`

function startRound(r){
  state.mode='round'; state.round=r; state.list=rounds(state.set)[r];
  state.i=0; state.correct=0; state.wrong=[]; state.miss={};
  const u=U(); u.last={sec:SEC, uid:state.set.uid, round:r}; save();
  phase1();
}
function startReview(list, set){
  state.mode='review'; state.set=set; state.round=null; state.list=shuffle(list);
  state.i=0; state.correct=0; state.wrong=[]; state.miss={};
  phase1();
}
function title(){ return state.mode==='review' ? 'Xatolarni takrorlash' : state.set.title+' · '+(state.round+1)+'-raund'; }
function backScreen(){ return state.mode==='review' && !state.set ? screenSets : screenRounds; }

function bar(phase, pct){
  const names=["Tanishtiruv","Variant tanlash","Yozish"];
  return `<div class="bar">
      <div class="step">${title()}</div>
      ${names.map((n,i)=>`<div class="step ${i+1===phase?'on':''}">${i+1}. ${n}</div>`).join('')}
    </div>
    <div class="prog"><i style="width:${pct}%"></i></div>`;
}
function markMiss(i, ok){ if(!ok) state.miss[i]=true; }
function commit(){
  const u=U();
  state.list.forEach((w,j)=>{ u.stats[w.uid][w.ko] = !state.miss[j]; });
  save();
  pushScore().then(()=>{ Object.keys(TOPS).forEach(k=>delete TOPS[k]); Object.keys(TOPERR).forEach(k=>delete TOPERR[k]); });
}

/* ---- 1: tanishtiruv ---- */
function phase1(){
  const w=state.list[state.i];
  app.innerHTML=`
    ${bar(1, state.i/state.list.length*100)}
    <div class="card" style="text-align:center;padding:44px 26px">
      <div class="hint">${state.i+1} / ${state.list.length}</div>
      <div class="ko" style="margin-top:14px">${w.ko}</div>
      <div class="uz">${w.uz}</div>
    </div>
    <div class="row">
      <button class="btn" id="next">${state.i+1===state.list.length?'Mashqni boshlash':"Keyingi so'z"}</button>
      <button class="btn ghost" id="prev" ${state.i===0?'disabled':''}>Orqaga</button>
      <button class="btn ghost" id="exit">Chiqish</button>
    </div>`;
  document.getElementById('next').onclick=()=>{
    if(state.i+1===state.list.length){ state.i=0;state.correct=0;state.wrong=[];phase2(); }
    else { state.i++; phase1(); }
  };
  document.getElementById('prev').onclick=()=>{ if(state.i>0){state.i--;phase1();} };
  document.getElementById('exit').onclick=backScreen();
}

/* ---- 2: variant tanlash ---- */
function makeOptions(w){
  const seen=new Set([w.uz]); const pick=[];
  const take=list=>{ for(const x of shuffle(list)){ if(pick.length>=3) return; const m=x.uz||x[1]; if(!seen.has(m)){ seen.add(m); pick.push(m); } } };
  take(state.list);
  take(setByUid(w.uid).words.map(x=>({uz:x[1]})));
  return shuffle(pick.concat([w.uz]));
}
function phase2(){
  const w=state.list[state.i], opts=makeOptions(w);
  app.innerHTML=`
    ${bar(2, state.i/state.list.length*100)}
    <div class="card">
      <div class="hint">${state.i+1} / ${state.list.length} · to'g'ri: ${state.correct}</div>
      <div class="ko" style="margin-top:10px">${w.ko}</div>
      <p class="hint" style="margin-top:8px">Ma'nosini tanlang.</p>
      <div class="opts">${opts.map((o,i)=>`<button class="opt" data-o="${i}">${o}</button>`).join('')}</div>
      <div class="fb" id="fb"></div>
    </div>
    <button class="btn ghost" id="exit">Chiqish</button>`;
  document.getElementById('exit').onclick=backScreen();
  const btns=[...app.querySelectorAll('.opt')];
  btns.forEach((b,i)=>b.onclick=()=>{
    btns.forEach(x=>x.disabled=true);
    const ok=opts[i]===w.uz;
    b.classList.add(ok?'ok':'no');
    if(!ok){ btns[opts.indexOf(w.uz)].classList.add('ok'); state.wrong.push(w); } else state.correct++;
    markMiss(state.i, ok);
    const fb=document.getElementById('fb');
    fb.className='fb '+(ok?'ok':'no');
    fb.innerHTML=ok?"To'g'ri.":`Noto'g'ri. <b>${w.ko}</b> — ${w.uz}`;
    setTimeout(()=>{
      if(state.i+1===state.list.length){ state.i=0;state.correct=0;state.wrong=[];phase3(); }
      else { state.i++; phase2(); }
    }, ok?650:1500);
  });
}

/* ---- 3: yozish ---- */
function phase3(){
  const w=state.list[state.i];
  app.innerHTML=`
    ${bar(3, state.i/state.list.length*100)}
    <div class="card">
      <div class="hint">${state.i+1} / ${state.list.length} · to'g'ri: ${state.correct}</div>
      <div class="big-uz" style="margin-top:10px">${w.uz}</div>
      <p class="hint" style="margin-top:8px">Koreyschasini yozing.${/[()]/.test(w.ko)?" Qavsli qism ixtiyoriy.":""}</p>
      <input type="text" id="in" name="k${Math.random().toString(36).slice(2)}" autocomplete="off" autocorrect="off"
             autocapitalize="off" spellcheck="false" data-form-type="other" data-lpignore="true" placeholder="한국어">
      <div class="row">
        <button class="btn" id="check">Tekshirish</button>
        <button class="btn ghost" id="show">Javobni ko'rsatish</button>
      </div>
      <div class="fb" id="fb"></div>
    </div>
    <button class="btn ghost" id="exit">Chiqish</button>`;
  document.getElementById('exit').onclick=backScreen();
  const inp=document.getElementById('in'); inp.focus();
  const fb=document.getElementById('fb');
  let answered=false;
  function done(ok){
    answered=true; inp.disabled=true; inp.classList.add(ok?'ok':'no');
    fb.className='fb '+(ok?'ok':'no');
    fb.innerHTML=ok?"To'g'ri.":`To'g'ri javob: <b>${w.ko}</b>`;
    if(ok) state.correct++; else state.wrong.push(w);
    markMiss(state.i, ok);
    setTimeout(()=>{
      if(state.i+1===state.list.length){
        commit();
        // so'zlar tugagach, shu bo'limning tinglash testi bo'lsa darhol ochiladi
        const s=state.set;
        if(state.mode==='round' && s && TESTS[s.uid] && !testRec(s) && allRoundsDone(s)) screenSetTest(s);
        else finish();
      }
      else { state.i++; phase3(); }
    }, ok?650:1800);
  }
  document.getElementById('check').onclick=()=>{
    if(answered) return;
    if(!inp.value.trim()){ inp.focus(); return; }
    done(accepted(w.ko).includes(norm(inp.value)));
  };
  document.getElementById('show').onclick=()=>{ if(!answered) done(false); };
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('check').click(); });
}

/* ---- yakun ---- */
function finish(){
  const n=state.list.length, pct=Math.round(state.correct/n*100);
  const missed=state.list.filter((w,j)=>state.miss[j]);
  const rs=state.set?rounds(state.set):[];
  const hasNext=state.mode==='round' && state.round+1<rs.length;
  app.innerHTML=`
    <div class="card">
      <h2>${state.mode==='review'?'Takrorlash tugadi':state.round+1+'-raund tugadi'}</h2>
      <div class="score">${state.correct} / ${n}</div>
      <p class="hint">Yozish bosqichi — ${pct}%</p>
      ${missed.length?`
        <h2 style="margin-top:24px">Xato qilgan so'zlaringiz</h2>
        <div class="list">${missed.map(w=>`<div><span class="k">${w.ko}</span><span class="v">${w.uz}</span></div>`).join('')}</div>
        <button class="btn" id="onlywrong">Faqat shu so'zlarni takrorlash (${missed.length} ta)</button>
        `:`<p class="hint" style="margin-top:14px">Hamma so'z to'g'ri.</p>`}
      <div class="row">
        <button class="btn ghost" id="again">${state.mode==='review'?'Qaytadan':'Raundni qayta yechish'}</button>
        ${hasNext?`<button class="btn ghost" id="next">${state.round+2}-raund</button>`:''}
        <button class="btn ghost" id="exit">${state.set?'Raundlar':"Variantlar"}</button>
      </div>
    </div>
    ${setDoneCard()}`;
  const ow=document.getElementById('onlywrong'); if(ow) ow.onclick=()=>startReview(missed, state.set);
  const ag=document.getElementById('again');
  ag.onclick=()=> state.mode==='review' ? startReview(state.list, state.set) : startRound(state.round);
  const nx=document.getElementById('next'); if(nx) nx.onclick=()=>startRound(state.round+1);
  document.getElementById('exit').onclick=backScreen();
  const ts=document.getElementById('tosets'); if(ts) ts.onclick=screenSets;
}
function setDoneCard(){
  if(state.mode!=='round') return '';
  const st=setStat(state.set); if(st.done<st.all) return '';
  const t=secStat();
  return `<div class="card">
      <h2>${state.set.title} tugadi</h2>
      <div class="score">${st.ok} / ${st.all}</div>
      <p class="hint">${st.no} ta xato</p>
      <h2 style="margin-top:22px">${secLabel(SEC)} — statistika</h2>
      <div class="score">${t.ok} / ${t.all}</div>
      <p class="hint">${t.no} ta xato · ${t.all-t.ok-t.no} ta so'z hali ishlanmagan</p>
      <button class="btn" id="tosets">Variantlarga qaytish</button>
    </div>`;
}

  { instruction:"※ [28~31] (　　　　)에 들어갈 말로 가장 알맞은 것을 고르십시오. (각 2점)",

      { num:28, content:{kind:"passage", text:"모든 사람이 항상 절약하고 저축을 많이 하면 모두 다 부자가 될 것 같지만 사실 그렇지 않다. 개인적으로는 절약하고 저축하는 것이 부자가 되는 길이겠지만, 국가 전체를 봤을 때는 절약과 저축만 하는 것은 (　　　　). 사람들이 돈을 쓰지 않으면 물건을 생산하고 판매하는 회사들이 어려워지고, 그것은 고용 불안정으로 이어지기 때문이다. 고용 불안정은 다시 소비를 줄어들게 하여 악순환이 시작된다."},
        options:["기업에도 도움이 될 수 있다","경제에 나쁜 영향을 미칠 수 있다","부유한 나라가 되는 유일한 길이다","더 좋은 물건을 생산할 수 있게 한다"], correct:1,
        explain:["뒤 내용(회사들이 어려워짐)과 반대된다.","(정답) 소비 감소 → 기업 어려움 → 고용 불안정의 악순환은 경제에 나쁜 영향을 미치는 것이다.","뒤 내용과 정반대이다.","본문 내용과 관련이 없다."] },
      { num:29, content:{kind:"passage", text:"대동여지도는 조선 시대에 제작된 지도이다. 이 지도는 (　　　　) 몇 가지 특징을 갖고 있다. 먼저 이 지도는 지금의 위성 사진과 비교해도 큰 차이가 없을 정도로 정확하다. 또한 기존 지도가 여러 정보를 글자로 표시한 반면에 이 지도는 간단한 기호로 표시했다. 그리고 산의 높이를 표시할 때 선의 굵기를 다르게 했다는 것도 주목할 만한 점이다."},
        options:["조선 시대에 유행한","당시의 지도와는 다른","기존 지도가 가지고 있던","시대 상황을 잘 보여주는"], correct:1,
        explain:["유행 여부에 대한 내용이 아니다.","(정답) 뒤에서 ‘기존 지도가 글자로 표시한 반면에’ 등 기존 지도와의 차이점을 나열하므로 어울린다.","대동여지도 고유의 특징을 설명하는 문맥과 반대된다.","특징 나열과 직접 관련이 없다."] },
      { num:30, content:{kind:"passage", text:"문화가 전파되는 방식은 전염병의 확산과 비슷한 점이 많다. 아주 오래전에는 한 지역에서 전염병이 발생하면 가장 가까운 지역부터 서서히 퍼졌다. 그런데 항해 시대가 열리면서부터는 전쟁과 무역을 통해서 멀리 떨어진 지역까지 퍼지게 되었다. 문화도 마찬가지로 처음에는 인접한 지역으로 퍼져 나가다가 (　　　　) 먼 지역까지 빠르게 문화가 전파될 수 있었다. 그러나 통신 기술의 발달로 인해 문화가 전파되는 방식이 조금 달라졌다. 전염병이 퍼지지 않는 지역까지 문화가 전달되는 현상이 나타나게 된 것이다."},
        options:["교통이 점차 발달하자","전쟁이 자주 발발해서","전염병의 확산과 함께","통신 기기의 발명 덕분에"], correct:0,
        explain:["(정답) ‘항해 시대가 열리면서’는 교통(항해술)의 발달을 의미하며, 그로 인해 먼 지역까지 문화가 전파된 흐름과 일치한다.","전쟁은 무역과 함께 나열된 수단 중 하나일 뿐 원인이 아니다.","문화 전파가 전염병 확산과 ‘비슷하다’는 것이지 함께 퍼진 것이 아니다.","이는 뒤 문장에서 ‘그러나’로 이어지는 이후 시대의 이야기이다."] },
      { num:31, content:{kind:"passage", text:"과거에는 위생과 환경 개선에 신경 쓰지 않아서 생기는 병이 많았는데, 생활 수준이 향상된 지금은 그러한 경우가 많이 없어졌다. 그러나 병원을 찾는 사람들은 여전히 줄지 않고 있다. 사람들은 이제 병에 걸렸기 때문에 병원을 찾는 것이 아니라, (　　　　) 의사를 만나기 때문이다. 이러한 시대 흐름에 맞추어 의료계에서도 질병 예방 및 건강 관리에 힘을 더 쏟고 있다."},
        options:["정신적인 문제를 해결하고자","치료의 역사에 대해 공부하고자","과거에 걸렸던 병을 확인하고자","병을 미리 막고 더 건강해지고자"], correct:3,
        explain:["본문에서 언급되지 않은 내용이다.","본문과 관련이 없다.","본문 내용과 관련이 없다.","(정답) 뒤 문장의 ‘질병 예방 및 건강 관리’와 연결되며, 예방을 위해 병원을 찾는다는 문맥과 일치한다."] }
    ]},

  { instruction:"※ [32~34] 다음을 읽고 글의 내용과 같은 것을 고르십시오. (각 2점)",
    questions:[
      { num:32, content:{kind:"passage", text:"같은 분야의 몇몇 가게가 가격 경쟁을 벌일 경우 그 경쟁은 점점 치열해져서 결국 한 가게만 남고 모두 문을 닫게 된다. 이것을 치킨 게임이라고 하는데, 이는 발전을 위한 경쟁을 허용하는 자본주의 사회에서 종종 일어나는 현상이다. 그러나 이런 치킨 게임을 하게 되면 많은 사람들이 피해를 볼 수 있기 때문에 정부가 나서서 조정할 필요가 있다. 과도한 경쟁을 피하기 위해 가격을 일정한 선 아래로는 떨어뜨릴 수 없도록 규제하거나 그 분야의 업체들이 서로 협의할 수 있는 자리를 마련해 주는 것이다."},
        options:["자본주의 사회에서의 자유로운 경쟁을 치킨 게임이라고 한다.","가격을 조정하기 위해 치킨 게임을 일정한 간격으로 해야 한다.","정부는 치킨 게임을 막기 위해 어느 정도의 규제를 하기도 한다.","정부는 자본주의 유지를 위해 기업들 간의 경쟁에 관여해서는 안 된다."], correct:2,
        explain:["자유로운 경쟁 자체가 아니라 극단적인 가격 경쟁 상황을 치킨 게임이라고 한다.","치킨 게임을 정기적으로 해야 한다는 내용은 없다.","(정답) ‘가격을 일정한 선 아래로는 떨어뜨릴 수 없도록 규제’한다는 내용과 일치한다.","정부가 나서서 조정할 필요가 있다고 했으므로 반대된다."] },
      { num:33, content:{kind:"passage", text:"한국의 헌법 중 가장 첫 번째 내용은 ‘대한민국은 민주 공화국이다.’이다. 법 중에서 가장 중요한 법이 헌법이고, 그 헌법에서 가장 먼저 나오는 내용이기 때문에, 이것은 대한민국의 정체성을 나타내는 아주 중요한 내용이다. 민주주의란 나라의 중요한 의사 결정을 국민들이 직접 하거나 국민들이 뽑은 대표가 하는 것을 말한다. 그리고 공화국이란 국가의 주권이 국민에게 있다는 것을 의미한다. 그러니까 이것은 대한민국의 주권이 국민에게 있고, 직접 또는 간접적으로 국민이 국가의 의사 결정을 한다는 뜻이다."},
        options:["헌법은 대한민국 법의 첫 번째 내용을 의미한다.","대한민국의 주권은 국민이 뽑은 대표에게 있다.","국가 차원의 의사 결정은 항상 국민들이 직접 한다.","민주주의는 국민의 뜻에 따라 의사를 결정하는 것이다."], correct:3,
        explain:["헌법이 법 중에서 가장 중요한 법이라는 것이지, 헌법이 법의 ‘첫 번째 내용’이라는 설명은 잘못됐다.","주권은 국민에게 있고 대표는 의사 결정을 대신할 뿐이다.","직접 또는 간접적으로 한다고 했으므로 ‘항상 직접’은 틀리다.","(정답) 민주주의는 국민이 직접 또는 대표를 통해 의사 결정을 하는 것이므로 일치한다."] },
      { num:34, content:{kind:"passage", text:"냉장고는 낮은 온도를 유지해서 신선함을 유지할 수 있게 해 주는 전자 제품이다. 냉장고의 원리는 냉매가 액체에서 기체로 변화하는 과정 중에 주변의 열을 빼앗아 가서 냉장고 안의 온도를 낮추는 것이다. 처음에는 냉매로 암모니아나 이산화황을 사용했으나 이것들은 악취가 심해서 프레온으로 바꾸었다. 그런데 프레온은 오존을 파괴하기 때문에 다시 새로운 물질을 찾았고, 그렇게 찾아낸 냉매가 바로 지금 사용되고 있는 HCFC이다."},
        options:["프레온은 악취가 심해서 냉매로 사용하지 않았다.","냉장고 안의 온도가 변하면 냉매의 상태가 변한다.","오존을 보호하기 위해 냉매로 사용된 물질을 바꾸었다.","환경을 위해서 냉매로 사용할 새로운 물질을 찾고 있다."], correct:2,
        explain:["악취 때문에 바뀐 것은 암모니아·이산화황이며, 프레온은 오존 파괴 때문에 바뀐 것이다.","냉매 상태 변화가 온도를 낮추는 원인이지, 온도 변화가 냉매 상태를 바꾸는 것이 아니다(인과관계 반대).","(정답) 프레온이 오존을 파괴해서 새로운 물질(HCFC)로 바꾸었다는 내용과 일치한다.","현재 HCFC를 사용하고 있다고 했으므로 ‘찾고 있다’는 틀리다."] }
    ]},

  { instruction:"※ [35~38] 다음을 읽고 글의 주제로 가장 알맞은 것을 고르십시오. (각 2점)",
    questions:[
      { num:35, content:{kind:"passage", text:"어떤 정보를 전달할 때는 여러 가지 것들을 고려해야 한다. 정확성, 체계성 등도 중요하지만 가장 먼저 생각해야 하는 것은 전달력이다. 정보를 전달하고자 하는 자가 어떤 것을 말했느냐는 사실 그렇게 중요하지 않다. 중요한 것은 정보를 전달받는 사람이 무엇을 들었느냐이다. 아무리 정확하고 체계적으로 구성된 정보라고 하더라도 전달받는 사람이 집중하기 어렵거나 오해하기 쉽다면 정보 전달이 제대로 이루어질 수 없기 때문이다."},
        options:["여러 가지 정보를 한 번에 전달하는 것이 가장 중요하다.","정보는 정확하고 체계적으로 구성해서 전달할 수 있어야 한다.","어떤 것을 전달할지 결정하는 과정에 더 많은 노력을 기울여야 한다.","효과적인 정보 전달을 위해 전달받는 사람의 입장을 더 생각해야 한다."], correct:3,
        explain:["한 번에 여러 정보를 전달하라는 내용이 아니다.","정확성·체계성도 중요하지만 ‘가장 먼저’는 전달력이라 했으므로 핵심 주제가 아니다.","무엇을 전달할지가 아니라 어떻게 전달받는지가 중요하다고 했다.","(정답) ‘전달받는 사람이 무엇을 들었느냐가 중요하다’는 것이 핵심 주제이다."] },
      { num:36, content:{kind:"passage", text:"외국어를 습득할 때 모국어는 도움이 될까, 아니면 방해가 될까? 연구자들의 말에 따르면 외국어와 모국어의 공통점이 있을 때는 모국어가 외국어 학습에 도움이 되는 반면에, 둘 사이에 다른 점이 있는 경우에는 모국어가 외국어 학습에 방해가 된다고 한다. 즉 모국어를 완전히 익힌 후에 외국어를 배우는 것이 어떤 면에서는 효율적일 수 있지만, 또 다른 면에서는 부정적으로 작용할 수도 있다는 것이다."},
        options:["외국어를 배울 때 모국어를 많이 활용하는 것이 좋다.","외국어와 모국어를 동시에 배우는 것이 가장 효율적이다.","모국어를 완전히 익히기 전에 외국어 학습을 시작하는 게 좋다.","모국어가 외국어 공부에 좋은 영향을 미칠 때도 있고 아닐 때도 있다."], correct:3,
        explain:["공통점이 있을 때만 도움이 되므로 항상 활용하는 것이 좋다고 할 수 없다.","동시에 배우는 것에 대한 언급은 없다.","완전히 익힌 후 배우는 것의 장단점을 설명했을 뿐, 그 전에 시작하라는 주장은 아니다.","(정답) 공통점이 있으면 도움이 되고 다른 점이 있으면 방해가 된다는, 상황에 따라 다르다는 것이 주제이다."] },
      { num:37, content:{kind:"passage", text:"사후 세계를 배경으로 한 영화 〈신과 함께〉는 1,400만 관객을 동원했다. 그리고 직장인들의 애환을 그린 드라마 〈미생〉은 상당한 시청률을 기록했다. 이 두 작품의 공통점은 웹툰을 원작으로 했다는 것이다. 웹툰이란 웹과 카툰을 합친 말로 웹을 통해 보는 만화를 뜻한다. 인터넷의 발달로 만화책 출판 시장은 크게 축소되었지만 웹툰이 새로운 대중문화의 한 분야로 자리 잡았고, 이제는 영화, 드라마, 굿즈 등 다양한 분야에서 큰 영향을 끼치고 있는 것이다."},
        options:["웹툰은 대중문화의 중요한 한 부분을 차지하고 있다.","인터넷의 발달로 영화, 드라마 시장이 많이 축소되었다.","웹툰을 원작으로 영화나 드라마를 제작하면 성공할 수 있다.","인터넷 보급으로 인해 여러 분야의 산업이 위기를 겪고 있다."], correct:0,
        explain:["(정답) 웹툰이 영화·드라마·굿즈 등 다양한 분야에 큰 영향을 끼치고 있다는 것이 핵심 주제이다.","축소된 것은 만화책 출판 시장이지 영화·드라마 시장이 아니다.","두 사례만으로 ‘항상 성공한다’고 일반화할 수 없다.","만화책 시장 축소는 언급되었지만 ‘여러 분야가 위기를 겪는다’는 주제는 아니며 오히려 웹툰은 성장했다."] },
      { num:38, content:{kind:"passage", text:"한 도시의 범죄율이 증가하자 그 도시의 시장이 엉뚱한 대책을 내놓았다. 무기 소지를 금지하거나 경찰들을 늘린 것이 아니라 지하철 무임승차 단속을 강화하고 거리에 쓰레기를 버리는 사람들에게 벌금을 내게 하는 등 아주 사소한 것들에 신경 쓴 것이다. 그런데 얼마 후 놀랍게도 이 도시의 범죄율은 급격히 줄어들었다. 가장 기본적인 것들부터 변화시키자 도시 전체의 분위기가 바뀌고 시민 의식이 높아진 것이다."},

  { instruction:"※ [39~41] 주어진 문장이 들어갈 곳으로 가장 알맞은 곳을 고르십시오. (각 2점)",
    questions:[
      { num:39, content:{kind:"insert", given:"그런데 이러한 의약 분업은 조선 시대에도 확실하게 이루어졌었다.",
          text:"한국에서는 2000년 7월에 의사와 약사의 역할을 완전히 나누었다. (㉠) 그전에는 의사와 약사 모두 진료와 약 처방을 병행했으나 의약 분업이 시행되면서 병원에서 의사가 진료를 하고 약을 처방하면 그 처방에 따라 약국에서 약사가 약을 만들어 주는 것이다. (㉡) 의사와 약사 모두 자기 전문 분야의 일에 집중하게 하자는 취지였다. (㉢) 하지만 당시의 의약 분업의 이유는 지금과는 좀 달랐다. (㉣) 조선 시대의 의원들은 너무 가난해서 약재를 준비할 만큼의 돈이 없었기 때문에 환자들에게 처방전만 써 주고 약은 재료가 충분히 구비되어 있는 약방에 맡길 수밖에 없었던 것이다."},
        options:["㉠","㉡","㉢","㉣"], correct:2,
        explain:["여기에 넣으면 2000년 의약 분업 설명 중간에 조선 시대 이야기가 끼어들어 흐름이 끊긴다.","아직 2000년 의약 분업의 취지를 설명하는 중이므로 어울리지 않다.","(정답) ‘하지만 당시의 이유는 지금과는 좀 달랐다’ 앞에서 ‘조선 시대에도 이루어졌다’는 문장이 먼저 나와야 자연스럽게 연결된다.","이 위치에 넣으면 ‘당시의 이유는 달랐다’는 문장 없이 바로 조선 시대 설명으로 넘어가 어색하다."] },
      { num:40, content:{kind:"insert", given:"그런데 사실 이것은 코카콜라의 광고에서 처음 그려진 산타클로스의 모습이다.",
          text:"크리스마스를 생각하면 가장 먼저 떠오르는 것 중 하나가 아이들에게 선물을 전해주는 산타클로스이다. (㉠) 우리가 지금 떠올리는 산타클로스는 빨간 옷에 빨간 모자, 그리고 흰 수염이 덥수룩한 인상 좋은 할아버지이다. (㉡) 코카콜라 광고 이전에는 각 나라마다 산타클로스의 모습이 다 달랐다. (㉢) 그런데 코카콜라에서 겨울철 판매량을 늘리기 위해 산타클로스를 등장시킨 광고를 만들었다. (㉣) 그 광고 이후로 전 세계의 산타클로스가 광고 속의 모습으로 통일된 것이다."},
        options:["㉠","㉡","㉢","㉣"], correct:1,

      { num:41, content:{kind:"insert", given:"국토가 큰 나라들은 그 넓은 지역에 비가 내리는 것 자체가 문제가 될 수 있기 때문이다.",

        options:["㉠","㉡","㉢","㉣"], correct:2,
        explain:["아직 무엇에 놀라는지 설명하기 전이므로 어울리지 않다.","일기예보 소식을 소개한 직후이므로, 왜 대재앙인지 이유(국토가 넓어서)가 먼저 나와야 자연스럽다.","(정답) ‘전국적으로 비가 내리는 것이 대재앙이다’ 뒤에 그 이유(국토가 커서 문제됨)가 나오고, 이어서 ‘하지만 한국은 면적이 좁아서’로 대조되는 흐름이 자연스럽다.","이미 ‘한국은 면적이 좁아서 문제되지 않는다’는 내용이 나온 뒤이므로 이유 설명이 뒤늦다."] }
    ]},

  { instruction:"※ [42~43] 다음을 읽고 물음에 답하십시오. (각 2점)",
    shared:{kind:"passage", text:"회사에서 제법 큰 프로젝트를 진행하느라 1년이 넘게 어머니를 찾아뵙지 못했다. 프로젝트를 마친 후 회사에서는 제법 긴 휴가를 줬고 나는 그 기간 동안 홀로 계신 어머니와 지내기로 했다. 어머니는 하루에 버스가 두 번씩만 가는 시골 중에서도 시골에서 태어나서 단 한 번도 그곳을 벗어나지 않으셨다. 아버지가 돌아가신 후에 내가 서울에서 모시고자 했지만 어머니는 홀로 거기에 사는 것을 택하셨다.<br><br>어머니 집에서의 하루하루는 고요하고 지루했다. 프로젝트가 끝날 때까지 한순간도 긴장을 늦추지 않아 몸과 맘이 몹시도 지쳐 있었던 나는 이 지루함이 매우 만족스러웠다. 나는 먹고 자고 산책하고 담배를 태우는 일 외에는 아무것도 하지 않았다. 며칠 후 난 산책을 마치고 대청마루에 앉아서 담배를 한 대 물었다. 그리고 라이터로 불을 붙이려 하는데 라이터가 고장이 나 있었다. 라이터를 살 곳도 없고 해서 <u>입맛을 다시며 한동안 먼 산만 바라보고 있는데</u>, 어머니께서 성냥 한 갑을 가지고 내게 다가왔다. 어머니는 내 옆에 서서 조심스레 성냥 한 개비를 꺼내서 성냥갑에 그었다. ‘칙, 칙, 칙’ 불은 붙지 않았고 성냥개비가 부러졌다. 나는 아무 말 없이 어머니를 바라보고 있었고 어머니도 아무 말 없이 다시 한 개비를 꺼내 들고 성냥갑에 그었다. 몇 번의 시도 끝에 불이 붙었다. 나는 조심스레 그 불로 담배에 불을 붙였고, 그것이 내 인생의 마지막 담배가 되었다."},
    questions:[

        explain:["어머니는 홀로 사는 것을 택하셨고, 나는 휴가 동안만 함께 지낸 것이다.","휴가를 받아 잠시 내려온 것이지 회사를 그만둔 것이 아니다.","(정답) ‘그것이 내 인생의 마지막 담배가 되었다’는 것은 그 이후로 담배를 끊었다는 의미이다.","지루함이 ‘매우 만족스러웠다’고 했으므로 힘들었다는 것은 틀리다."] }

  { instruction:"※ [44~45] 다음을 읽고 물음에 답하십시오. (각 2점)",

        options:["너무나 많은 환자를 보고","의료진의 의료 기술을 보고","체계적인 치료 절차를 보고","그곳의 끔찍한 위생 상태를 보고"], correct:3,

      { num:45, prompt:"윗글의 주제로 가장 알맞은 것을 고르십시오.",
        options:["더 좋은 선택을 하는 데에 통계학이 큰 역할을 한다.","한 사람의 능력과 헌신은 많은 사람들에게 큰 도움을 준다.","병을 치료하는 것보다 더 중요한 것은 환경을 개선하는 것이다.","의학 기술의 발달로 과거보다 더 많은 환자를 살릴 수 있게 되었다."], correct:0,

      { num:33, content:{kind:"passage", text:"바닷물을 마셔 보면 짠맛을 느낄 수 있는데 이는 염분을 함유하고 있기 때문이다. 바닷물에는 소금이 비교적 일정한 비율로 들어 있으며, 전 세계 바닷물의 염분 농도 평균값은 3.43%이다. 그런데 어떤 바다는 농도가 조금 진하고 또 어떤 지역은 조금 묽은 편인데, 이러한 차이는 지역마다 강수량이 다르기 때문이다. 비나 눈이 많이 오는 지역은 염분의 농도가 다른 지역에 비해 약간 낮아지는 것이다. 비슷한 이유로 극지방의 염분 농도가 낮은 것은 빙하가 녹아서 생긴 물이 바다로 들어가기 때문이다."},
        options:["지역별 바닷물의 염분 농도는 강수량의 영향을 받는다.","전 세계 바닷물의 염분 농도는 지역과 관계없이 항상 똑같다.","비나 눈이 많이 오는 지역의 바닷물은 염분 농도가 높아진다.","극지방은 눈이 많이 오기 때문에 바닷물의 염분 농도가 낮아진다."], correct:0,
        explain:["(정답) 지역마다 농도가 다른 이유가 강수량 차이 때문이라고 했다.","지역마다 농도가 조금씩 다르다고 했다.","비나 눈이 많이 오는 지역은 오히려 농도가 낮아진다.","극지방의 농도가 낮은 것은 눈이 아니라 빙하가 녹은 물 때문이다."] },
      { num:34, content:{kind:"passage", text:"서울시 내 한 대학교 앞 식당가에는 ‘고민 사거리’라고 불리는 곳이 있다. 식당가 골목이 서로 맞닿는 작은 사거리인데, 점심시간마다 점심으로 어떤 것을 먹을지 고민하는 학생들이 삼삼오오 모여 있어서 붙여진 지명이다. 행동이나 태도를 결정해야 할 때 망설이기만 하고 결단하지 못하는 것을 가리키는 ‘결정 장애’를 잘 보여주는 예라고 할 수 있다. 어떤 일을 결정할 때 신중하게 생각하는 것도 중요하지만 그 신중함이 지나치면 중요한 시기를 놓쳐버릴 수도 있음을 기억해야 한다."},
        options:["결정 장애는 너무 쉽게 결정해 버리는 것을 말한다.","오랫동안 생각할수록 더 좋은 결정을 내릴 수 있다.","이미 결단한 것에 대해서는 더 이상 후회하지 않는 것이 좋다.","고민 사거리에는 점심 메뉴를 결정하지 못한 학생들이 모이곤 한다."], correct:3,
        explain:["결정 장애는 쉽게 결정하는 것이 아니라 망설이며 결정하지 못하는 것이다.","지나친 신중함은 오히려 중요한 시기를 놓치게 만든다고 경고한다.","이미 결단한 것에 대한 내용은 나오지 않는다.","(정답) 점심 메뉴를 고민하는 학생들이 모여서 ‘고민 사거리’라는 이름이 붙었다고 했다."] }

  { instruction:"※ [35~38] 다음을 읽고 글의 주제로 가장 알맞은 것을 고르십시오. (각 2점)",
    questions:[
      { num:35, content:{kind:"passage", text:"가까운 미래에 드론이 택배 서비스에 이용될 것이라고 한다. 드론을 이용한 택배 서비스는 기존 방식보다 훨씬 빠르고 정확하게 배달할 수 있어 많은 사람들이 빨리 드론 택배 시대가 오기를 기대하고 있다. 그러나 전문가들은 택배 서비스용 드론이 과연 안전한가에 대한 의문을 가지고 있다. 하늘을 나는 드론에 이상이 생겨서 추락하거나 공중에서 드론끼리 충돌할 경우 아주 위험한 상황이 발생할 수 있기 때문이다. 편리함도 중요하지만 가장 중요한 것은 안전이라는 것을 잊어서는 안 될 것이다."},
        options:["서비스의 신속함보다는 안전을 가장 우선적으로 고려해야 한다.","편리함을 위해서 가끔 위험한 상황이 발생하는 것은 감수해야 한다.","더 나은 서비스를 위해서 드론 택배 서비스의 빠른 도입이 필요하다.","드론 택배는 기존 택배보다 빠르고 정확할 뿐만 아니라 더 안전하다."], correct:0,
        explain:["(정답) 마지막 문장에서 편리함보다 안전이 가장 중요하다고 분명히 밝히고 있다.","위험을 감수해야 한다는 내용과 정반대이다.","빠른 도입을 주장하는 글이 아니라 안전을 먼저 확인해야 한다는 글이다.","안전에 대해서는 오히려 의문이 제기되고 있다."] },
      { num:36, content:{kind:"passage", text:"현대 사회에서는 과거와 비교할 수 없을 정도로 많은 영상물을 아주 쉽게 접할 수 있다. 이러한 변화에 따라 사람들은 이제 문자보다는 빠르게 움직이는 화면을 통해서 지식을 습득하는 일에 익숙해졌다. 하지만 전문가들은 이러한 방식을 통해 습득한 지식은 머릿속에 체계적으로 정리해서 저장할 수가 없기 때문에 기억에 오래 남지 않을 뿐만 아니라 스스로 생각할 수 있는 비판적 사고 능력을 잃게 만든다고 지적한다."},
        options:["영상물을 보면서 지식을 습득하는 방식에는 몇 가지 단점이 있다.","현대인은 여전히 문자를 통해 지식을 습득하는 것이 더 익숙하다.","문자보다 영상을 통해서 지식을 습득하는 것이 빠르고 효율적이다.","지식 습득에 도움이 되는 좋은 영상물을 더 많이 제작할 필요가 있다."], correct:0,
        explain:["(정답) 기억에 오래 남지 않고 비판적 사고 능력을 잃게 만든다는 두 가지 단점을 지적하고 있다.","오히려 문자보다 영상에 익숙해졌다고 했다.","효율적이라는 평가가 아니라 단점을 지적하는 글이다.","영상물 제작에 대한 내용은 없다."] },
      { num:37, content:{kind:"passage", text:"자연재해로 인한 피해가 꾸준히 늘고 있다. 1980년대에 비해 피해 규모는 두 배나 늘었고, 피해액은 다섯 배가 늘었다고 한다. 현대 과학이 끊임없이 발전하고 있음에도 불구하고 이렇게 피해가 늘고 있는 이유는 자연재해에 대비하는 기술이 부족하기 때문이 아니라 인간의 활동 영역이 점차 늘어나고 있기 때문이다. 늘어나는 피해 규모가 오히려 과학 기술은 발전하고 있음을 보여 주는 것이다."},
        options:["무분별한 개발로 환경 오염이 심해지면서 자연재해가 늘어났다.","과학 기술이 발달하면서 자연재해로 인한 피해가 점차 늘고 있다.","과학 기술의 발전 덕분에 1980년대부터 피해가 꾸준히 줄고 있다.","과학이 발전했지만 자연재해를 예방하는 기술은 오히려 퇴보했다."], correct:1,
        explain:["환경 오염이 원인이라는 내용은 없다.","(정답) 인간의 활동 영역이 넓어진 것 자체가 과학 발전의 결과이며, 그로 인해 피해 규모가 계속 늘고 있다는 것이 핵심이다.","피해는 줄어든 것이 아니라 계속 늘고 있다.","기술 부족이 원인이 아니라고 명확히 밝히고 있다."] },
      { num:38, content:{kind:"passage", text:"90년대에 있었던 교복에 관련된 논란에서는 ‘복장이 태도에 영향을 줄 수 있다’는 논리를 펼친 교복 찬성론이 우세했고, 대부분의 학교가 이 입장을 받아들여 학생들에게 교복을 입게 했다. 그런데 20여 년이 지난 지금 다시 이 문제가 거론되고 있다. 이번에는 교복을 입느냐 마느냐의 문제가 아니라 공부하는 학생들에게 조금 더 편한 옷을 입혀야 한다는 것이다. 그리고 시간이 지날수록 이러한 주장은 널리 받아들여져 좀 더 편안한 소재와 디자인의 교복으로 바꾸는 학교가 점차 늘고 있다."},
        options:["교복 착용 찬반 논란이 20여 년 만에 다시 시작되었다.","복장은 학생의 태도에 영향을 미치기 때문에 교복을 입어야 한다.","교복은 불편하기 때문에 학생들에게 교복 자율화를 실시해야 한다.","요즘은 학생들에게 좀 더 편한 교복을 입히기 위한 노력을 하고 있다."], correct:3,
        explain:["이번 논의는 교복 착용 여부가 아니라 편안함에 대한 것이라고 명시했다.","이는 90년대 논란의 논리일 뿐, 지금 글의 주제가 아니다.","교복을 없애자는 것이 아니라 더 편하게 개선하자는 내용이다.","(정답) 편안한 소재와 디자인으로 교복을 바꾸는 학교가 늘고 있다는 것이 글의 핵심이다."] }
    ]},

  { instruction:"※ [39~41] 주어진 문장이 들어갈 곳으로 가장 알맞은 것을 고르십시오. (각 2점)",

          text:"한 여성이 마라톤에 참가한 직후에 다량의 스포츠 음료를 마신 후 뇌장애로 사망하는 사건이 발생했다. (ㄱ) 의학계에서는 이 부분에 주목하여, 체력을 많이 소모하는 운동을 한 후 수분을 너무 많이 섭취하면 위험하다는 연구 결과를 발표했다. (ㄴ) 연구에 따르면 실제로 이러한 이유로 사망한 사람이 일곱 명이나 된다고 한다. (ㄷ) 전문가들은 건강에 도움이 되는 것이라도 지나치면 오히려 해가 될 수 있다고 경고한다. (ㄹ)"},

        options:["①","②","③","④"], correct:1,
        explain:["속담 바로 뒤에 들어가면 아직 일반 원리에 대한 설명이 나오지 않은 상태이다.","(정답) 일반 원리(생활 속 불편 해결)를 예로 보여 주는 문장이므로, ‘그 학생’이 처음 언급되는 다음 문장 앞(ㄴ)에 들어가야 자연스럽다.","이미 ‘그 학생’이 언급된 뒤이므로 여기에 들어가면 인물 소개 순서가 어색해진다.","맨 뒤에 들어가면 이미 결과까지 설명된 뒤라 어색하다."] },
      { num:41, content:{kind:"insert", given:"나아가 작가는 새로 나온 이 책이 복잡한 철학책이 아니라 재미있는 이야기책이라고 소개한다.",
          text:"우리에게 <살아간다는 것>이라는 시집으로 익숙한 시인 김도현이 새로운 산문집을 내서 화제이다. (ㄱ) 산문집의 제목은 <모든 죽어가는 것들>로 그의 시집 제목과 관련이 있는 듯해서 더욱 눈길을 끈다. (ㄴ) 작가는 이 산문집에서 우리가 잘 알면서도 종종 잊고 살아가는 생명의 소중함을 일깨워준다. (ㄷ) 실제로 책에는 여러 가지 이야기가 실려 있는데, 독자들은 그 이야기를 통해 자연스럽게 삶과 생명의 의미에 대해서 생각해 볼 수 있을 듯하다. (ㄹ)"},
        options:["①","②","③","④"], correct:2,
        explain:["산문집 소개가 시작되기도 전이라 너무 이르다.","제목에 대한 설명 바로 뒤라 아직 책의 성격에 대한 언급이 나오지 않았다.","(정답) ‘나아가’로 이어지는 문장은 앞의 설명에 내용을 더하는 것이므로, 책의 의미를 설명한 문장 뒤(ㄷ)에 들어가야 자연스럽다.","이미 책 속 이야기에 대한 설명까지 끝난 뒤라 순서가 어색하다."] }

/* ---- MOCK: 도움 함수 ---- */
function mockAllQuestions(mock){ return mock.groups.flatMap(g=>g.questions.map(q=>({...q, group:g}))); }
function mockTotalCount(mock){ return mockAllQuestions(mock).length; }
const mockState = { mock:null, answers:{}, startTime:0, endTime:0, timerId:null, remainSec:0, finished:false, warned:[], audio:null };
let MOCKNOTE=null;   // tark etilgan imtihon tiklanganda ko'rsatiladigan xabar

/* Server ok/done qiymatlarini 100000 dan oshirmaydi (ortig'ini kesadi).
   Shuning uchun ball va vaqt bitta songa siqilmaydi: ok = ball (0~100),
   done = soniya (0~4200). Saralash bu yerda, brauzerda qilinadi.
   -v2: eski, buzuq natijalar aralashmasligi uchun reyting nomi yangilandi. */
function mockGame(mockId){ return GAME+'-mock-'+mockId+'-v2'; }
// Worker bitta ismga bitta qator saqlaydi. Shuning uchun har bir urinish
// alohida ism bilan yuboriladi: "Behruz", "Behruz (2)", "Behruz (3)"...
function mockAttemptName(n){ return n<=1 ? DB.current : DB.current+' ('+n+')'; }
function isMyMockRow(name){ return name===DB.current || name.indexOf(DB.current+' (')===0; }
function mockAttemptCount(mockId){
  const u=U(); if(!u || !u.mockAttempts2) return 0;
  return u.mockAttempts2[mockId]||0;
}
// server qaytargan qatorlarni tartiblash: avval ball (ko'p), keyin vaqt (kam)
function mockMaxScore(mock){ return mockTotalCount(mock)*2; }
function mockSortRows(rows, mock){
  const maxSec=mock?mock.durationSec:4200, maxOk=mock?mockMaxScore(mock):100;
  return rows.filter(r=>typeof r.ok==='number' && r.ok>=0 && r.ok<=maxOk && r.done<=maxSec)
             .sort((a,b)=> b.ok-a.ok || a.done-b.done);
}
async function pushMockScore(mockId, score, seconds, attempt){
  try{
    await fetch(API+'/score',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({game:mockGame(mockId),name:mockAttemptName(attempt),
                           ok:Math.min(100,Math.max(0,Math.round(score))),
                           done:Math.min(99999,Math.max(0,Math.round(seconds)))})});
  }catch(e){ /* internet yo'q */ }
}

/* ---- MOCK: tark etilgan imtihonni tiklash ----
   Har bir javob localStorage'ga yozib boriladi. O'quvchi sahifani yopib
   ketsa, keyingi kirishda o'sha javoblari bo'yicha baholanib reytingga
   yuboriladi. Qayta ishlamoqchi bo'lsa boshidan boshlaydi. */
function mockSavePending(){
  const u=U(); if(!u) return;
  u.mockPending={ mockId:mockState.mock.id, answers:mockState.answers,
                  endTime:mockState.endTime, durationSec:mockState.mock.durationSec };
  save();
}
function mockClearPending(){
  const u=U(); if(!u) return;
  u.mockPending=null; save();
}
function mockScoreOf(mock, answers){
  let score=0;
  mockAllQuestions(mock).forEach(q=>{ if(answers[q.num]===q.correct) score+=2; });
  return score;
}
function mockNextAttempt(mockId){
  const u=U(); if(!u) return 1;
  if(!u.mockAttempts2) u.mockAttempts2={};
  const n=(u.mockAttempts2[mockId]||0)+1;
  u.mockAttempts2[mockId]=n; save();
  return n;
}
// ilova ochilganda chaqiriladi
async function mockRecoverPending(){
  const u=U(); if(!u || !u.mockPending) return;
  const p=u.mockPending;
  const m=MOCKS.find(x=>x.id===p.mockId);
  const answered=m?Object.keys(p.answers||{}).length:0;
  if(!m || !answered){ mockClearPending(); return; }   // bitta ham javob yo'q — hisobga olinmaydi
  const score=mockScoreOf(m, p.answers);
  const seconds=Math.min(p.durationSec, Math.max(0, Math.round(p.durationSec-(p.endTime-Date.now())/1000)));
  const n=mockNextAttempt(m.id);
  mockClearPending();

/* ============ 50 so'z testi ============
   Har bir MOCK so'z bo'limi uchun (masalan 156 so'zli 제1회 듣기,
   104 so'zli 제3회 읽기) 50 talik tasodifiy test. 1~30 variant tanlash,
   31~50 yozish. Vaqt tugasa savol o'zi almashadi.
   Ustoz masofadan ochib/yopib turadi (Worker kodiga tegmasdan). */
const WORDTESTS = [
  { id:'wt1', secId:'mocklisten1', title:"50 so'z testi",
    choose:30, write:20, chooseSec:10, writeSec:15, pass:'ustoz2026' },
  { id:'wt2', secId:'mockread3', title:"50 so'z testi",
    choose:30, write:20, chooseSec:10, writeSec:30, pass:'ustoz2026' },
  { id:'wt3', secId:'mocklisten2', title:"50 so'z testi",
    choose:30, write:20, chooseSec:10, writeSec:15, pass:'ustoz2026' },
];
let WT = WORDTESTS[0];                              // joriy test
function wtBySecId(secId){ return WORDTESTS.find(w=>w.secId===secId); }
function wtSection(){ return SECTIONS.find(s=>s.id===WT.secId); }
function wtGame(){ return GAME+'-wt-'+WT.id; }
function wtGateGame(){ return GAME+'-gate-'+WT.id; }
function wtRec(){ const u=U(); return (u&&u.wt&&u.wt[WT.id])||null; }

/* ---- ustoz kaliti (har test o'z holatini alohida saqlaydi) ---- */
let WTGATES = {};   // {[testId]: {open, until} | null (bog'lanmadi) | undefined}
async function wtLoadGate(){
  try{
    const r=await fetch(API+'/top?game='+wtGateGame()+'&cb='+Date.now());
    const d=await r.json();
    const row=(d.rows||[]).find(x=>x.name==='GATE');
    if(!row || !row.ok){ WTGATES[WT.id]={open:false, until:0}; return WTGATES[WT.id]; }
    const until=row.t + row.ok*60000;          // ok = necha daqiqaga ochilgani
    WTGATES[WT.id]={open:Date.now()<until, until};
  }catch(e){ WTGATES[WT.id]=null; }
  return WTGATES[WT.id];
}
async function wtSetGate(minutes){
  try{
    await fetch(API+'/score',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({game:wtGateGame(), name:'GATE', ok:Math.max(0,Math.round(minutes)), done:1})});
  }catch(e){}
  WTGATES[WT.id]=undefined;
  await wtLoadGate();
}

/* ---- savollarni tayyorlash ---- */
function wtAllWords(){
  const sec=SECTIONS.find(s=>s.id===WT.secId);
  return sec ? sec.sets.flatMap(s=>s.words.map(w=>({ko:w[0], uz:w[1]}))) : [];
}
function wtBuild(){
  const pool=shuffle(wtAllWords());
  const pick=pool.slice(0, WT.choose+WT.write);
  return pick.map((w,i)=>{
    if(i<WT.choose){
      const others=shuffle(pool.filter(x=>x.ko!==w.ko)).slice(0,3).map(x=>x.ko);
      return {ko:w.ko, uz:w.uz, type:'choose', options:shuffle([w.ko,...others])};
    }
    return {ko:w.ko, uz:w.uz, type:'write'};
  });
}
function wtSave(){
  const u=U(); if(!u) return;
  if(!u.wt) u.wt={};
  u.wt[WT.id]={items:wtState.items, answers:wtState.answers, i:wtState.i, spent:wtState.spent};
  save();
}
function wtClear(){ const u=U(); if(u&&u.wt) delete u.wt[WT.id]; save(); }
function wtAttempt(){
  const u=U(); if(!u) return 1;
  if(!u.wtAttempts) u.wtAttempts={};
  const n=(u.wtAttempts[WT.id]||0)+1; u.wtAttempts[WT.id]=n; save();
  return n;
}
function wtAttemptCount(){ const u=U(); return (u&&u.wtAttempts&&u.wtAttempts[WT.id])||0; }

function wtRenderGate(hasPending){
  const box=document.getElementById('wtgate'); if(!box) return;
  const gate=WTGATES[WT.id];
  if(gate===undefined){ box.innerHTML='<p class="hint">Holat tekshirilmoqda...</p>'; return; }
  if(gate===null){

      <div class="row" style="margin-top:10px"><button class="btn ghost" id="wtretry">Qayta tekshirish</button></div>`;
  } else if(!gate.open){
    box.innerHTML=`<div class="wtlock"><b>🔒 Test hali ochilmagan</b>

      <div class="row" style="margin-top:10px"><button class="btn ghost" id="wtretry">Tekshirish</button></div>`;
  } else {
    const qoldi=Math.max(0,Math.round((gate.until-Date.now())/60000));
    box.innerHTML=`<div class="wtlock" style="background:#EAF7EE;border-color:var(--ok)">
        <b style="color:var(--ok)">✓ Test ochiq</b>
        <p class="hint" style="margin-top:6px">Yopilishiga ~${qoldi} daqiqa qoldi.</p></div>
      <div class="row" style="margin-top:10px">
        <button class="btn" id="wtstart">${hasPending?'Davom etish':'Boshlash'}</button>
      </div>`;
  }
  const rt=document.getElementById('wtretry');
  if(rt) rt.onclick=async()=>{ WTGATES[WT.id]=undefined; wtRenderGate(hasPending); await wtLoadGate(); wtRenderGate(hasPending); };
  const st=document.getElementById('wtstart');
  if(st) st.onclick=()=>wtStart(hasPending);
  // ochilishini kutayotgan bo'lsa, har 15 soniyada o'zi tekshiradi
  clearTimeout(window.__wtPoll);

    window.__wtPoll=setTimeout(async()=>{ if(document.getElementById('wtgate')){ await wtLoadGate(); wtRenderGate(hasPending); } },15000);
  }
}

/* ---- test ---- */
function wtStart(resume){
  const pend=resume?wtRec():null;
  wtState = (pend && pend.items) ?
    {items:pend.items, answers:pend.answers||[], i:pend.i||0, spent:pend.spent||0, finished:false, timerId:null} :
    {items:wtBuild(), answers:[], i:0, spent:0, finished:false, timerId:null};
  wtSave();
  wtRenderQ();
}
function wtRenderQ(){
  if(wtState.i>=wtState.items.length){ wtFinish(); return; }
  const q=wtState.items[wtState.i];
  const lim=q.type==='choose'?WT.chooseSec:WT.writeSec;
  wtState.qEnd=Date.now()+lim*1000;
  whoEl.innerHTML=`<span>O'quvchi: <b>${DB.current}</b></span><span class="hint">Test davom etmoqda</span>`;
  app.innerHTML=`
    <div class="card">
      <div class="wtcount"><span>${wtState.i+1} / ${wtState.items.length}</span>
        <span>${q.type==='choose'?'Tanlash':'Yozish'} · ${lim} s</span></div>
      <div class="wtbar" id="wtbar"><i style="width:100%"></i></div>
      <div class="wtword">${q.uz}</div>
      <div class="wtsub">${q.type==='choose'?'Koreyschasini tanlang':'Koreyschasini yozing'}</div>
      ${q.type==='choose'
        ? `<div class="opts" style="margin-top:14px">${q.options.map((o,oi)=>`<button class="opt" data-o="${oi}">${o}</button>`).join('')}</div>`
        : `<input class="wtinput" id="wtin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="한국어">
           <div class="row" style="margin-top:12px"><button class="btn" id="wtok">Keyingisi</button></div>`}
    </div>`;
  if(q.type==='choose'){
    app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>wtAnswer(q.options[+b.dataset.o]));
  } else {
    const inp=document.getElementById('wtin');
    inp.focus();
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') wtAnswer(inp.value); });
    document.getElementById('wtok').onclick=()=>wtAnswer(inp.value);
  }
  clearInterval(wtState.timerId);
  wtState.timerId=setInterval(()=>wtTick(lim), 100);
}
function wtTick(lim){
  const left=wtState.qEnd-Date.now();
  const bar=document.getElementById('wtbar');
  if(bar){
    bar.firstElementChild.style.width=Math.max(0,left/(lim*1000)*100)+'%';
    bar.classList.toggle('low', left<lim*1000*0.3);
  }
  if(left<=0) wtAnswer(null);
}
function wtAnswer(val){
  clearInterval(wtState.timerId);
  const q=wtState.items[wtState.i];
  const lim=(q.type==='choose'?WT.chooseSec:WT.writeSec)*1000;
  const ok = val!=null && norm(String(val))===norm(q.ko);
  wtState.answers[wtState.i]={given:val==null?'':String(val).trim(), ok};
  wtState.spent += lim - Math.max(0, wtState.qEnd-Date.now());
  wtState.i++;
  wtSave();
  wtRenderQ();
}
async function wtFinish(){
  if(wtState.finished) return;
  wtState.finished=true;
  clearInterval(wtState.timerId);
  const correct=wtState.answers.filter(a=>a&&a.ok).length;
  const seconds=Math.max(1,Math.round(wtState.spent/1000));
  const n=wtAttempt();
  wtClear();
  window.scrollTo(0,0);
  app.innerHTML='<div class="card"><h2>Hisoblanmoqda...</h2></div>';
  const g=wtGame(); delete TOPS[g]; delete TOPERR[g];
  try{
    await fetch(API+'/score',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({game:g, name:mockAttemptName(n),
        ok:Math.min(99999,correct), done:Math.min(99999,seconds)})});
  }catch(e){}
  wtResult(correct, seconds, n);
}
function wtResult(correct, seconds, n){
  whoBar(2);
  const items=wtState.items, ans=wtState.answers;
  app.innerHTML=`
    <div class="card">
      <h2>${WT.title} — natija</h2>
      <div class="score">${correct} / ${items.length}</div>
      <p class="hint">Sarflangan vaqt: ${mockFmtTime(seconds)} · ${n}-urinish · reytingda <b>${mockAttemptName(n)}</b></p>
    </div>
    ${wtRankCard()}
    <div class="card">
      <h2>Javoblar</h2>
      <div class="list" style="margin-top:8px">
        ${items.map((q,i)=>{const a=ans[i]||{};return `<div>
          <span class="k" style="color:${a.ok?'var(--ok)':'var(--no)'}">${q.ko}</span>
          <span class="v">${q.uz}${a.ok?'':` · yozgan: <b>${a.given||'—'}</b>`}</span></div>`;}).join('')}
      </div>
    </div>
    <div class="card"><div class="row"><button class="btn" id="wtback">Ortga</button></div></div>`;

function wtRankCard(){

  if(rows===undefined && !err) body='<p class="hint">Yuklanmoqda...</p>';

          <td class="num">${mockFmtTime(r.done)}</td></tr>`).join('')}
      </table>`;
  }
  return `<div class="card"><h2>${WT.title} — reyting</h2>
    <p class="hint">Ko'proq topgan va tezroq ishlagan yuqorida turadi.</p>
    ${body}<button class="btn ghost" id="reload">Yangilash</button></div>`;

  el.className='mocktoast'+(urgent?' urgent':'');
  el.textContent=txt;
  void el.offsetWidth;

}
function mockCheckWarn(){

function wireMockAudio(){
  const au=document.getElementById('mockaudio'); if(!au) return;
  mockState.audio=au;
  const btn=document.getElementById('auplay');
  const state=document.getElementById('austate');
  au.onended=()=>{ if(!mockState.finished) finishMock(); };
  // orqaga qaytarishga urinishni bekor qilamiz
  let far=0;
  au.ontimeupdate=()=>{ if(au.currentTime>far) far=au.currentTime; };
  au.onseeking=()=>{ if(Math.abs(au.currentTime-far)>1.5) au.currentTime=far; };
  au.onpause=()=>{ if(!mockState.finished && !au.ended){ au.play().catch(()=>{
    if(btn) btn.style.display=''; if(state) state.textContent='방송이 멈췄습니다'; }); } };
  const p=au.play();
  if(p && p.catch) p.catch(()=>{
    if(btn) btn.style.display='';
    if(state) state.textContent='방송을 시작하려면 버튼을 누르세요';
  });
  if(btn) btn.onclick=()=>{ au.play().then(()=>{
    btn.style.display='none'; if(state) state.textContent='듣기 방송 중'; }).catch(()=>{}); };
}

  if(c.kind==='headline') return `<div class="headlinebox">${c.text}</div>`;
  if(c.kind==='chart'){
    const max=Math.max(...c.bars.map(b=>b.value));

  }

    let acc=0;

function ssState(){
  const u=U(); if(!u) return null;
  if(!u.sseogi) u.sseogi=ssBlankState();
  return u.sseogi;
}
function ssEsc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function ssMarkBlanks(text){
  return ssEsc(text).replace(/\(\s*ㄱ\s*\)/g,'<b>( ㄱ )</b>').replace(/\(\s*ㄴ\s*\)/g,'<b>( ㄴ )</b>');
}
function ssManuscriptHTML(text, max){
  const cols=10;
  const rows=Math.ceil(max/cols);
  const chars=[...String(text||'')].slice(0,max);
  let html='<div class="ss-manu">';
  for(let r=0;r<rows;r++){
    html+='<div class="ss-manu-row">';
    for(let c=0;c<cols;c++){
      const ch=chars[r*cols+c];
      html+=`<div class="ss-manu-cell">${ch&&ch!==' '?ssEsc(ch):''}</div>`;
    }
    const mark=(r+1)*cols;
    const showLabel = mark%50===0 || r===rows-1;
    html+=`<div class="ss-manu-num">${showLabel?Math.min(mark,max):''}</div>`;
    html+='</div>';
  }
  html+='</div>';
  return html;
}
function ssDownloadBlob(blob, filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
function ssLoadLibs(){
  if(window.jspdf && window.html2canvas) return Promise.resolve();
  const ld=src=>new Promise((res,rej)=>{ const el=document.createElement('script'); el.src=src; el.onload=res; el.onerror=()=>rej(new Error("Kutubxona yuklanmadi, internetni tekshiring")); document.head.appendChild(el); });
  return Promise.all([
    ld('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),
    ld('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')
  ]);
}
function ssSteps(active){
  const order=['51','52','53','54'];
  const cur=order.indexOf(active);
  return `<div class="ss-steps">${order.map((k,i)=>{
    const cls = k===active?'on' : (i<cur?'done':'');
    return `<span class="${cls}">${k}-savol</span>`;
  }).join('')}</div>`;
}

  ta.addEventListener('input',()=>{ s.a54.essay=ta.value; save(); renderManu(); });
  renderManu();

  document.getElementById('ssfinish').onclick=()=>{ s.a54.essay=ta.value.trim(); save(); ssFinishAll(); };

async function ssGeneratePdf(){
  // Koreyscha (한글) matn jsPDF'ning standart lotin shriftida chizilmaydi, shuning uchun
  // butun sahifa html2canvas bilan rasmga olinadi. Bitta ulkan rasmni manfiy offset bilan
  // "kesib" har sahifaga qo'yish ba'zi PDF o'quvchilarni (masalan poppler) buzilishga
  // olib kelgani aniqlandi — shuning uchun har PDF sahifasi uchun ALOHIDA, aniq o'lchamli
  // PNG rasm yasab, uni sahifaga (0,0) dan oddiy joylashtiramiz.
  await ssLoadLibs();
  ssBuildPrintRoot();
  const root=document.getElementById('ssPrintRoot');
  const canvas=await html2canvas(root, {scale:2, useCORS:true, windowWidth:780});
  const pdf=new jspdf.jsPDF({unit:'pt',format:'a4'});
  const pageW=595.28, pageH=841.89;
  const pagePx=Math.floor(canvas.width*(pageH/pageW));
  let renderedPx=0, first=true;
  while(renderedPx<canvas.height){
    const sliceH=Math.min(pagePx, canvas.height-renderedPx);
    const pageCanvas=document.createElement('canvas');
    pageCanvas.width=canvas.width;
    pageCanvas.height=sliceH;
    const ctx=pageCanvas.getContext('2d');
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,sliceH);
    ctx.drawImage(canvas, 0,renderedPx,canvas.width,sliceH, 0,0,canvas.width,sliceH);
    const drawH=sliceH*(pageW/canvas.width);
    if(!first) pdf.addPage();
    pdf.addImage(pageCanvas.toDataURL('image/jpeg', 0.88), 'JPEG', 0, 0, pageW, drawH);
    renderedPx+=sliceH;
    first=false;
  }
  return pdf;
}
function ssPdfFilename(){ return `TOPIK_yozish_${DB.current}.pdf`.replace(/\s+/g,'_'); }
async function ssFinishAll(){
  const s=ssState();

  try{
    const pdf=await ssGeneratePdf();
    ssDownloadBlob(pdf.output('blob'), ssPdfFilename());
    s.submitted=true; s.submittedAt=Date.now();

}
